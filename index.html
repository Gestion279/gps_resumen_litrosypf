<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consumos de vehículos</title>

<!-- PWA: instalable en escritorio y en pantalla de inicio del celular -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d9488">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Consumos">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    /* Paleta corporativa reducida: navy (títulos/valores) + turquesa (único acento) */
    --navy-950:#0f2a47;
    --navy-900:#15314f;
    --navy-800:#1c3a5a;

    --teal-700:#0c7d72;
    --teal-600:#0f9d8b;
    --teal-500:#20b5a2;
    --teal-50:#eafbf8;

    --canvas:#f4f8f7;   /* fondo general: gris muy claro, apenas verdoso/frío */

    --slate-50:#f6f7f9;
    --slate-100:#eceef2;
    --slate-200:#dde1e8;
    --slate-400:#8b93a3;
    --slate-600:#535c6c;
    --slate-800:#2a3242;
    --amber:#e6a91b;
    --amber-dark:#b8820e;
    --green:#1c9a5b;
    --green-bg:#e5f6ec;
    --red:#c0432f;
    --gray-mid:#8b93a3;

    /* Un solo tinte neutro para el ícono de TODAS las tarjetas KPI —
       ya no hay un color distinto por tarjeta, todas comparten el mismo sistema. */
    --kpi-icon-bg:#eafbf8;
    --kpi-icon-fg:#0f9d8b;

    --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
    --radius: 10px;
    --radius-sm: 8px;
    --shadow-card: 0 1px 2px rgba(15,42,71,.03), 0 2px 6px rgba(15,42,71,.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-ui);
    background:var(--canvas);
    color:var(--slate-800);
    font-size:14px;
    line-height:1.45;
  }
  @font-face{font-family:"Inter";src:local("Inter");}
  a{color:inherit;}
  button{font-family:inherit;font-size:inherit;cursor:pointer;}
  input,select{font-family:inherit;font-size:inherit;}

  /* ---------- Layout shell (tabs arriba, sin sidebar) ---------- */
  #app{display:flex;flex-direction:column;min-height:100vh;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    padding:20px 28px;border-bottom:1px solid var(--slate-100);background:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .topbar-titles{display:flex;align-items:center;gap:12px;}
  .topbar-titles .pin{
    width:38px;height:38px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none;
    box-shadow:0 0 0 1px var(--slate-100);
  }
  .topbar h1{font-size:19px;margin:0;font-weight:700;color:var(--navy-950);letter-spacing:-.2px;}
  .topbar .meta{font-size:12.5px;color:var(--slate-400);margin-top:1px;}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--slate-200);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--slate-600);flex:none;position:relative;
  }
  .icon-btn:hover{background:var(--slate-50);}
  .icon-btn svg{width:16px;height:16px;}
  .content{padding:24px 28px 60px 28px;flex:1;}

  /* ---------- Tabs (reemplazan al sidebar) ---------- */
  /* Pestañas estilo "carpeta": izquierda redondeada, derecha en diagonal,
     superpuestas. Colores del diseño: activa en verde (el mismo del botón
     "Cargar planilla"), inactivas en blanco con contorno verde. */
  .tabbar{
    display:flex;align-items:flex-end;gap:0;padding:10px 26px 0 22px;overflow-x:auto;overflow-y:hidden;
    background:#fff;border-bottom:2px solid var(--teal-600);scrollbar-width:thin;
  }
  .tab-item{
    position:relative;z-index:1;flex:none;
    padding:8px 30px 7px 16px;margin-right:-10px;margin-bottom:0;
    font-size:13px;font-weight:600;color:var(--teal-700);background:none;border:none;white-space:nowrap;
    transition:color .12s ease;
  }
  .tab-item::before, .tab-item::after{
    content:'';position:absolute;top:0;bottom:0;background:#fff;
    border:1px solid var(--teal-600);border-bottom:none;transition:background .12s ease;
  }
  /* mitad izquierda: borde vertical y esquina redondeada */
  .tab-item::before{z-index:-1;left:0;right:21px;border-right:none;border-radius:6px 0 0 0;}
  /* mitad derecha: inclinada */
  .tab-item::after{z-index:-2;right:6px;width:30px;border-left:none;border-radius:0 5px 0 0;transform:skewX(24deg);transform-origin:bottom;}
  .tab-item:hover{z-index:2;}
  .tab-item:hover::before, .tab-item:hover::after{background:var(--teal-50);}
  .tab-item.active{color:#fff;font-weight:700;z-index:3;padding-top:9px;}
  .tab-item.active::before, .tab-item.active::after{background:var(--teal-600);border-color:var(--teal-600);}
  .tab-item:focus-visible{outline:2px solid var(--teal-700);outline-offset:-4px;border-radius:6px;}

  /* ---------- Filters: selectores refinados, altura uniforme ---------- */
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;}
  .filter-pill{
    position:relative;display:flex;align-items:center;border:1px solid var(--slate-200);
    border-radius:var(--radius-sm);background:#fff;padding:0 13px;height:36px;
    box-shadow:0 1px 2px rgba(15,42,71,.02);
  }
  .filter-pill:hover{border-color:#c7cedb;}
  .filter-pill svg{width:14px;height:14px;min-width:14px;color:var(--slate-400);flex:none;margin-right:8px;}
  .filter-pill select{
    border:none;background:transparent;padding:0;color:var(--slate-800);
    min-width:170px;font-weight:600;font-size:12.5px;appearance:none;-webkit-appearance:none;
  }
  .filter-pill select:focus{outline:none;}
  .filter-pill.active-filter{border-color:var(--teal-600);}
  .ms-wrap{position:relative;}
  .ms-trigger{background:none;border:none;padding:0;color:var(--slate-800);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .ms-panel{
    position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:#fff;border:1px solid var(--slate-200);
    border-radius:var(--radius-sm);box-shadow:0 12px 30px rgba(15,23,42,.16);width:260px;padding:10px;
  }
  .ms-search input{
    width:100%;padding:7px 9px;border:1px solid var(--slate-200);border-radius:var(--radius-sm);
    font-size:12.5px;margin-bottom:8px;
  }
  .ms-item{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:12.5px;color:var(--slate-800);border-radius:6px;cursor:pointer;}
  .ms-item:hover{background:var(--slate-50);}
  .ms-item input{flex:none;}
  .ms-all{font-weight:700;border-bottom:1px solid var(--slate-100);margin-bottom:4px;padding-bottom:8px;}
  .ms-list{max-height:220px;overflow-y:auto;}
  .ms-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--slate-100);}
  .ms-actions .btn{padding:6px 12px;font-size:12.5px;}

  /* ---------- KPI cards: uniformes, mismo sistema visual para las 8 ---------- */
  .kpi-grid{display:flex;flex-wrap:nowrap;gap:10px;margin-bottom:24px;overflow-x:auto;padding-bottom:4px;}
  .kpi-card{
    border-radius:var(--radius-sm);padding:13px 14px;position:relative;background:#fff;
    box-shadow:var(--shadow-card);border:1px solid var(--slate-100);flex:1 0 118px;min-width:118px;
  }
  .kpi-card .kpi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:9px;}
  .kpi-icon{
    width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;
    background:var(--kpi-icon-bg);color:var(--kpi-icon-fg);
  }
  .kpi-icon svg{width:13px;height:13px;}
  .kpi-trend{
    display:inline-flex;align-items:center;gap:2px;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:99px;
  }
  .kpi-trend.up{background:var(--green-bg);color:var(--green);}
  .kpi-trend.down{background:#fdeeec;color:#c0432f;}
  .kpi-trend svg{width:8px;height:8px;}
  .kpi-card .label{font-size:10.5px;color:var(--slate-600);margin-bottom:4px;font-weight:600;letter-spacing:.01em;white-space:nowrap;}
  .kpi-card .value{font-size:19px;font-weight:700;color:var(--navy-950);letter-spacing:-.2px;line-height:1.1;}
  .kpi-card .unit{font-size:10.5px;color:var(--slate-400);margin-left:3px;font-weight:600;}
  .kpi-card .caption{font-size:9.5px;color:var(--slate-400);margin-top:4px;}

  /* ---------- Cards / panels ---------- */
  .panel{background:#fff;border-radius:var(--radius);margin-bottom:26px;box-shadow:var(--shadow-card);border:1px solid var(--slate-100);}
  .panel-head{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .panel-head-left{display:flex;align-items:center;gap:10px;}
  .panel-head-left .ic{
    width:30px;height:30px;border-radius:9px;background:var(--teal-50);color:var(--teal-600);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .panel-head-left .ic svg{width:15px;height:15px;}
  .panel-head h2{font-size:15.5px;margin:0;font-weight:700;color:var(--navy-950);}
  .panel-head .sub{font-size:12px;color:var(--slate-400);margin-top:2px;}
  .panel-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .panel-body{padding:0 20px 20px 20px;}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;font-size:10.5px;color:var(--slate-400);font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:11px 14px;border-bottom:1px solid var(--slate-100);white-space:nowrap;
  }
  th .sort-ic{display:inline-block;margin-left:3px;opacity:.4;font-size:9px;vertical-align:middle;}
  th .sort-ic.active{opacity:1;color:var(--teal-600);}
  th.th-sort{cursor:pointer;user-select:none;}
  th.th-sort:hover{color:var(--slate-800);}
  td{padding:12px 14px;border-bottom:1px solid var(--slate-50);white-space:nowrap;color:var(--slate-800);}
  tbody tr:nth-child(even){background:#fafbfc;}
  tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .table-wrap{overflow-x:auto;}
  .row-click{cursor:pointer;transition:background .1s ease;}
  .row-click:hover{background:var(--teal-50);}
  .row-chevron{color:var(--slate-400);}
  .row-chevron svg{width:15px;height:15px;}
  .device-name{font-weight:600;color:var(--navy-950);}

  /* ---------- Pivot tables (Km recorridos / Litros consumidos) ---------- */
  table.pivot-table td.sticky-col, table.pivot-table th.sticky-col{
    position:sticky;left:0;background:#fff;z-index:2;box-shadow:1px 0 0 var(--slate-100);
  }
  table.pivot-table tr.pivot-total-row td{font-weight:700;background:var(--slate-50);color:var(--navy-950);}
  table.pivot-table tr.pivot-total-row td.sticky-col{background:var(--slate-50);}
  table.pivot-table th.sticky-col{z-index:3;}
  table.pivot-table tbody tr:nth-child(even) td.sticky-col{background:#fafbfc;}
  table.pivot-table td, table.pivot-table th{white-space:nowrap;}
  table.pivot-table td{padding:7px 14px;}
  table.pivot-table th{padding:9px 14px;}
  .pivot-scroll{overflow:auto;margin:0 20px 20px 20px;}
  .pivot-scroll table thead th{position:sticky;top:0;background:#fff;z-index:3;box-shadow:0 1px 0 var(--slate-200);}
  .pivot-scroll table.tabla-detalle td{padding:7px 14px;}
  .pivot-scroll table.tabla-detalle th{padding:9px 14px;}
  .pivot-scroll table.pivot-table thead th.sticky-col{z-index:5;}
  .pivot-scroll table.pivot-table tr.pivot-total-row td{position:sticky;top:var(--pivot-head-h,34px);z-index:2;box-shadow:0 1px 0 var(--slate-200);}
  .pivot-scroll table.pivot-table tr.pivot-total-row td.sticky-col{z-index:4;}

  /* ---------- Indicadores: grilla 2 filas x 2 columnas ---------- */
  .ind-toolbar{display:flex;justify-content:flex-end;margin-bottom:12px;}
  .ind-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-bottom:26px;}
  .ind-grid > .panel{margin-bottom:0;min-width:0;}
  .ind-chart{height:250px;}

  /* Tarjetas: más aire, título con más peso y subtítulo discreto */
  .ind-grid .panel-head{padding:18px 22px 14px 22px;align-items:flex-start;}
  .ind-grid .panel-head-left{align-items:flex-start;gap:12px;}
  .ind-grid .panel-head-left .ic{width:32px;height:32px;border-radius:9px;margin-top:1px;}
  .ind-grid .panel-head-left .ic.ic-amber{background:#eef3ef;color:#5d7358;}
  .ind-grid .panel-head-left .ic.ic-kml{background:#eef3f4;color:#3c6470;}
  .ind-grid .panel-head h2{font-size:15px;font-weight:700;color:var(--navy-950);letter-spacing:-.1px;line-height:1.3;}
  .ind-grid .panel-head .sub{font-size:11.5px;color:var(--slate-400);margin-top:2px;font-weight:500;}
  .ind-grid .panel-head-actions .btn{padding:7px 14px;font-size:12.5px;}
  .ind-grid .panel-body{padding:4px 22px 18px 22px;}

  /* Tarjetas de gráfico de las hojas Km recorridos y Litros consumidos */
  .panel-graf .panel-head{padding:18px 22px 14px 22px;align-items:flex-start;}
  .panel-graf .panel-head-left{align-items:flex-start;gap:12px;}
  .panel-graf .panel-head-left .ic{width:32px;height:32px;border-radius:9px;margin-top:1px;}
  .panel-graf .panel-head h2{font-size:15px;font-weight:700;color:var(--navy-950);letter-spacing:-.1px;line-height:1.3;}
  .panel-graf .panel-head .sub{font-size:11.5px;color:var(--slate-400);margin-top:2px;font-weight:500;}
  .panel-graf .panel-body{padding:4px 22px 18px 22px;}
  .panel-graf .graf-area{height:270px;}
  /* Íconos de los gráficos, en tonos de la paleta de barras */
  .ic.ic-blue{background:#e8edf5;color:#1b4079;}
  .ic.ic-orange{background:#eff3f2;color:#5b7571;}

  /* Gráficos: hover discreto sobre la barra (el valor exacto sigue en el tooltip) */
  .bar-chart rect.bar{transition:opacity .12s ease;}
  .bar-chart rect.bar:hover{opacity:.78;}

  /* Tablas: meses compactos pero legibles, dispositivo más ancho y fijo */
  .ind-grid .pivot-scroll{margin:0 22px 20px 22px;border:1px solid var(--slate-100);border-radius:var(--radius-sm);}
  .ind-grid table.pivot-table{font-size:12.5px;}
  .ind-grid table.pivot-table th{padding:10px 12px;font-size:10px;letter-spacing:.05em;color:var(--slate-600);background:#fff;}
  .ind-grid table.pivot-table td{padding:8px 12px;border-bottom:1px solid var(--slate-100);}
  .ind-grid table.pivot-table td.num, .ind-grid table.pivot-table th.num{min-width:62px;}
  .ind-grid table.pivot-table th.sticky-col, .ind-grid table.pivot-table td.sticky-col{
    min-width:200px;box-shadow:1px 0 0 var(--slate-200);
  }
  .ind-grid .pivot-scroll table thead th{box-shadow:inset 0 -1px 0 var(--slate-200);}
  .ind-grid .pivot-scroll table thead th.sticky-col{box-shadow:inset 0 -1px 0 var(--slate-200), 1px 0 0 var(--slate-200);}
  .ind-grid table.pivot-table tbody tr:not(.pivot-total-row):hover td{background:#f1f8f7;}
  /* Fila Total: fondo gris suave, semibold y separada de los vehículos */
  .ind-grid table.pivot-table tr.pivot-total-row td{
    font-weight:600;color:var(--navy-950);background:var(--slate-50);
    border-bottom:none;box-shadow:inset 0 -1px 0 var(--slate-200);
  }
  .ind-grid table.pivot-table tr.pivot-total-row td.sticky-col{
    background:var(--slate-50);box-shadow:inset 0 -1px 0 var(--slate-200), 1px 0 0 var(--slate-200);
  }

  /* ---------- Auditoría de consumos ---------- */
  .aud-head{margin-bottom:16px;}
  .aud-head h2{font-size:18px;margin:0;font-weight:700;color:var(--navy-950);letter-spacing:-.2px;}
  .aud-head p{margin:3px 0 0 0;font-size:12.5px;color:var(--slate-400);}
  .aud-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px;}
  .aud-card{
    text-align:left;background:#fff;border:1px solid var(--slate-100);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-card);padding:13px 15px;font:inherit;color:inherit;border-top:3px solid var(--slate-200);
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  .aud-card:hover{box-shadow:0 2px 10px rgba(15,42,71,.08);}
  .aud-card.activa{border-color:var(--slate-200);box-shadow:0 0 0 2px #dfe6f0;}
  .aud-card-prioritaria{border-top-color:#c0432f;}
  .aud-card-revisar{border-top-color:#dd8a2e;}
  .aud-card-observar{border-top-color:#e2bf3a;}
  .aud-card-normal{border-top-color:#8FAD88;}
  .aud-card-top{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--slate-600);}
  .aud-card-n{font-size:22px;font-weight:700;color:var(--navy-950);margin-top:6px;letter-spacing:-.3px;}
  .aud-card-sub{font-size:10.5px;color:var(--slate-400);margin-top:1px;}

  .aud-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;}
  .aud-dot-normal{color:#7fa377;} .aud-dot-observar{color:#d9b22c;} .aud-dot-revisar{color:#dd8a2e;} .aud-dot-prioritaria{color:#c0432f;}
  .aud-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .aud-badge.aud-normal{background:#eef4ec;color:#4f7348;}
  .aud-badge.aud-observar{background:#fbf5dc;color:#8a6d0c;}
  .aud-badge.aud-revisar{background:#fcefe0;color:#a45a14;}
  .aud-badge.aud-prioritaria{background:#fbe8e4;color:#a8372a;}
  .aud-txt-1{color:#8a6d0c;} .aud-txt-2{color:#a45a14;} .aud-txt-3{color:#a8372a;font-weight:600;}
  .aud-sub{display:block;font-size:10.5px;color:var(--slate-400);font-weight:500;}

  .aud-table td{vertical-align:middle;}
  .aud-table td.sticky-col{min-width:210px;}
  .aud-senales-cell{max-width:320px;overflow:hidden;text-overflow:ellipsis;color:var(--slate-600);font-size:12.5px;}
  .aud-n{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--slate-100);color:var(--slate-800);font-size:10.5px;font-weight:700;margin-right:7px;}
  .aud-table tbody tr.row-click:hover td{background:#f1f5f9;}

  .aud-criterios{display:block;}
  .aud-criterios summary{display:flex;align-items:flex-start;gap:12px;padding:16px 22px;cursor:pointer;list-style:none;}
  .aud-criterios summary::-webkit-details-marker{display:none;}
  .aud-criterios summary .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;}
  .aud-criterios summary .ic svg{width:15px;height:15px;}
  .aud-criterios summary h2{font-size:15px;margin:0;font-weight:700;color:var(--navy-950);}
  .aud-criterios summary .sub{font-size:11.5px;color:var(--slate-400);margin-top:2px;}
  .aud-toggle{margin-left:auto;font-size:11.5px;color:var(--slate-400);white-space:nowrap;}
  .aud-criterios[open] .aud-toggle{visibility:hidden;}
  .aud-criterios-body{padding:0 22px 20px 66px;font-size:12.5px;color:var(--slate-600);line-height:1.55;}
  .aud-criterios-body p{margin:0 0 10px 0;}
  .aud-crit-table{margin:4px 0 14px 0;font-size:12px;border:1px solid var(--slate-100);border-radius:var(--radius-sm);}
  .aud-crit-table th{padding:8px 12px;} .aud-crit-table td{padding:7px 12px;}

function icon(name, cls){

}
const KPI_TINTS = { blue:'kpi-blue', green:'kpi-green', teal:'kpi-teal', amber:'kpi-amber', violet:'kpi-violet', rose:'kpi-rose' };

/* =========================================================================
   ⚙️  CONFIGURACIÓN DE SUPABASE — reemplazar acá los dos valores
   Project Settings → API → Project URL / anon public key
   ========================================================================= */
const DEFAULT_SUPABASE_URL = 'https://oixzkvkybqexvrzwzwis.supabase.co';
const DEFAULT_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9peHprdmt5YnFleHZyend6d2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTUxNzEsImV4cCI6MjEwNDQzMTE3MX0.BTghtY8mZkyrK2y-kZXMb1aIecptX3OHOpNFqUBMzP4';

let state = {

  importState: null, // { file, parsedRows, periodo, periodoLabel, hash, preview, importing }
};

/* ---------------------------------------------------------------------
   Config (URL + anon key) — se guarda en localStorage del navegador
   --------------------------------------------------------------------- */
function getConfig(){
  try{
    const saved = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
    if(saved && saved.url && saved.anonKey) return saved;
  }catch(e){}
  if(DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_ANON_KEY && DEFAULT_SUPABASE_ANON_KEY !== 'PEGAR_ACA_LA_ANON_KEY'){
    return { url: DEFAULT_SUPABASE_URL, anonKey: DEFAULT_SUPABASE_ANON_KEY };
  }
  return null;
}
function saveConfig(cfg){
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){}
}
function clearConfig(){
  try{ localStorage.removeItem(CFG_KEY); }catch(e){}
}
function getZonasConocidas(){
  try{ return JSON.parse(localStorage.getItem(ZONAS_CONOCIDAS_KEY) || JSON.stringify(ZONAS_DEFAULT)); }catch(e){ return ZONAS_DEFAULT.slice(); }
}
function addZonaConocida(z){
  const list = getZonasConocidas();
  if(z && !list.includes(z)){ list.push(z); localStorage.setItem(ZONAS_CONOCIDAS_KEY, JSON.stringify(list)); }
}

function initSupabase(){
  const cfg = getConfig();
  if(!cfg || !cfg.url || !cfg.anonKey) return null;
  try{
    return window.supabase.createClient(cfg.url, cfg.anonKey);
  }catch(e){ return null; }
}

/* ---------------------------------------------------------------------

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}

/* ---------------------------------------------------------------------
   Utilidades de formato
   --------------------------------------------------------------------- */
function fmtNum(n, dec){
  if(n===null || n===undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('es-AR', {minimumFractionDigits:dec||0, maximumFractionDigits:dec||0});
}
function periodoLabelFromKey(key){
  if(!key) return '';
  const [y,m] = key.split('-');
  return `${MESES_CAP[parseInt(m,10)-1]} ${y}`;
}
function esc(s){
  return String(s===null||s===undefined?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

   celda (texto con unidad, número crudo, o duración de Excel).
   ========================================================================= */

// alias de encabezados aceptados por campo (todo en minúsculas, sin tildes)
const HEADER_ALIASES = {

  distancia_km:     ['distancia','distancia km','distancia recorrida','kilometros','km recorridos'],
  velocidad_maxima: ['velocidad maxima','velocidad max','vel maxima','vel. maxima','velocidad'],
  litros_ypf:       ['litros ypf','litros','combustible litros','combustible'],
};
// zonas conocidas de fábrica (se amplía sola al detectar nuevas al cargar vehículos)
const ZONAS_DEFAULT = ['REDES','SALTA','MENDOZA','SAN LUIS','SAN JUAN','CORDOBA','ENTRE RIOS','SGO DEL ESTERO','NEA NORTE','NOA CENTRO'];

function normalizarTexto(s){
  return String(s||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // saca tildes
    .trim().replace(/\s+/g,' ');
}

function matchHeaderField(headerText){
  const h = normalizarTexto(headerText);
  if(!h) return null;
  for(const [field, aliases] of Object.entries(HEADER_ALIASES)){
    if(aliases.some(a => h === a || h.includes(a))) return field;
  }
  return null;
}

// localiza la fila de encabezados y arma el mapa {campo: índice de columna}
// escaneando las primeras filas de la hoja — no asume una posición fija.
function detectarEncabezados(rows){
  let mejor = { idx:-1, mapa:{}, matches:0 };
  const limite = Math.min(rows.length, 25);
  for(let i=0;i<limite;i++){
    const fila = rows[i] || [];
    const mapa = {};
    fila.forEach((celda, col) => {
      const campo = matchHeaderField(celda);
      if(campo && mapa[campo]===undefined) mapa[campo] = col;
    });
    const matches = Object.keys(mapa).length;
    if(matches > mejor.matches && mapa.dispositivo !== undefined){
      mejor = { idx:i, mapa, matches };
    }
  }
  return mejor.matches >= 2 ? mejor : null; // dispositivo + al menos 1 campo más
}

// El TEXTO que se muestra siempre es "Dispositivo" tal cual viene en el
// reporte (dispositivo_original) — eso nunca se toca. Pero para AGRUPAR el
// historial de un mismo vehículo hace falta una clave estable: si el texto
// completo cambiara de un período a otro (ej. porque cambió de zona:
// "AF220RZ PARTNER REDES" -> "AF220RZ PARTNER CORDOBA"), usar el texto
// entero como clave partiría al vehículo en dos. Por eso se extrae SOLO la
// patente (si se puede reconocer) como clave interna; si no se reconoce
// ninguna, se usa el texto completo como respaldo — nunca bloquea la carga.
function normalizarTextoConservandoMayus(raw){
  return String(raw||'').trim().replace(/\s+/g,' ');
}
function juntarPatentePartida(parts){
  const out = [];
  let i = 0;
  while(i < parts.length){
    const a = parts[i], b = parts[i+1], c = parts[i+2];
    if(a && b && c && /^[A-Z]{2}$/i.test(a) && /^\d{3}$/.test(b) && /^[A-Z]{2}$/i.test(c)){ out.push(a+b+c); i+=3; continue; }
    if(a && b && ((/^[A-Z]{2}\d{3}$/i.test(a) && /^[A-Z]{2}$/i.test(b)) || (/^[A-Z]{2}$/i.test(a) && /^\d{3}[A-Z]{2}$/i.test(b)))){ out.push(a+b); i+=2; continue; }
    if(a && b && /^[A-Z]{3}$/i.test(a) && /^\d{3}$/.test(b)){ out.push(a+b); i+=2; continue; }
    out.push(a); i+=1;
  }
  return out;
}
function extraerPatenteClave(textoCompleto){
  const RE_MERCOSUR = /^[A-Z]{2}\d{3}[A-Z]{2}$/;
  const RE_VIEJA = /^[A-Z]{3}\d{3}$/;
  let parts = textoCompleto.split(' ').filter(Boolean);
  parts = juntarPatentePartida(parts);
  const encontrada = parts.find(p => RE_MERCOSUR.test(p.toUpperCase()) || RE_VIEJA.test(p.toUpperCase()));
  return encontrada ? encontrada.toUpperCase() : null;
}

// Distancia: puede venir como número crudo (ya en km) o como texto "2501 Km" / "364 m"
function parseDistancia(raw){
  if(raw===null || raw===undefined || raw==='') return null;
  if(typeof raw === 'number') return round(raw, 3);
  const s = String(raw).trim().replace(',', '.');
  const m = s.match(/([\d.]+)\s*(km|m)\b/i);
  if(m){
    const val = parseFloat(m[1]);
    if(isNaN(val)) return null;
    return m[2].toLowerCase()==='km' ? round(val,3) : round(val/1000,3);
  }
  const asNum = parseFloat(s);
  return isNaN(asNum) ? null : round(asNum,3);
}

// Horas (motor / ralentí): puede venir como texto "91 h 16 min", como número
// puro de horas, o como duración cruda de Excel (fracción de día, ej 6.035).
function parseHoras(raw){
  if(raw===null || raw===undefined || raw==='') return null;
  if(typeof raw === 'number'){
    // Heurística: una duración de Excel para "horas en un mes" no debería
    // superar ~31*24=744hs. Si el número ya viene expresado en horas
    // (>50) lo tomamos tal cual; si es una fracción de día (<50) lo
    // multiplicamos por 24. Esto cubre archivos que exportan ya en horas
    // y archivos que exportan la celda de duración cruda de Excel.
    return raw < 50 ? round(raw*24, 2) : round(raw, 2);
  }
  const s = String(raw).trim();
  if(s==='') return null;
  const m = s.match(/(\d+)\s*h\s*(\d+)?\s*min?/i);
  if(m){
    const h = parseInt(m[1],10) || 0;
    const min = parseInt(m[2]||'0',10) || 0;
    return round(h + min/60, 2);
  }
  const asNum = parseFloat(s.replace(',','.'));
  return isNaN(asNum) ? null : round(asNum,2);
}

function parseVelocidad(raw){
  if(raw===null || raw===undefined || raw==='') return null;
  if(typeof raw === 'number') return round(raw,1);
  const m = String(raw).match(/([\d.,]+)/);
  if(!m) return null;
  return round(parseFloat(m[1].replace(',','.')), 1);
}

function parseLitros(raw){
  if(raw===null || raw===undefined || raw==='') return null;
  const n = typeof raw === 'number' ? raw : parseFloat(String(raw).replace(',','.'));
  return isNaN(n) ? null : round(n,2);
}

const EXCEL_EPOCH_MS = Date.UTC(1899,11,30);
function excelSerialToISO(serial){
  const ms = EXCEL_EPOCH_MS + Math.round(serial) * 86400000;
  return new Date(ms).toISOString().slice(0,10);
}
function parseFechaInicio(raw){
  if(raw===null || raw===undefined || raw==='') return null;
  if(raw instanceof Date) return raw.toISOString().slice(0,10);
  if(typeof raw === 'number') return excelSerialToISO(raw);
  const s = String(raw).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m){
    const [_, d, mo, y] = m;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  return null;
}
function periodoDeFecha(fechaISO){
  if(!fechaISO) return null;
  const key = fechaISO.slice(0,7); // 'YYYY-MM'
  return { periodo:key, label: periodoLabelFromKey(key) };
}

function round(n, dec){
  const f = Math.pow(10,dec);
  return Math.round(n*f)/f;
}

// Período GLOBAL del archivo (metadata o nombre de archivo). Si no se
// encuentra, cada fila usa su propio período derivado de "Fecha de inicio"
// (ver periodoDeFecha) — esto es lo que permite importar reportes
// consolidados que abarcan varios meses en un solo Excel.
function detectarPeriodoGlobal(rows, fileName){
  for(const r of rows){
    const c0 = String(r[0]||'').toLowerCase();
    if(c0.includes('período') || c0.includes('periodo')){
      const val = String(r[1]||'');
      const m = val.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if(m){
        const mes = m[2].padStart(2,'0');
        const anio = m[3];
        return { periodo: `${anio}-${mes}`, label: periodoLabelFromKey(`${anio}-${mes}`) };
      }
    }
  }
  const lower = (fileName||'').toLowerCase();
  for(let i=0;i<MESES.length;i++){
    if(lower.includes(MESES[i])){
      const y = lower.match(/(20\d{2})/);
      if(y){
        const mm = String(i+1).padStart(2,'0');
        return { periodo: `${y[1]}-${mm}`, label: periodoLabelFromKey(`${y[1]}-${mm}`) };
      }
    }
  }
  return { periodo: null, label: null };
}

async function hashFile(file){
  const buf = await file.arrayBuffer();
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function parseExcel(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array' }); // sin cellDates: dejamos que cada
                                                // parser interprete el tipo crudo
  // no asumimos el nombre de la hoja — probamos todas hasta encontrar encabezados válidos
  let encontrado = null, sheetName = null, rows = null;
  for(const name of wb.SheetNames){
    const ws = wb.Sheets[name];
    const r = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null });
    const enc = detectarEncabezados(r);
    if(enc){ encontrado = enc; sheetName = name; rows = r; break; }
  }
  if(!encontrado){
    return { periodo:null, periodoLabel:null, rows:[], errores:[], totalFilas:0, sheetName:null,
      errorGeneral:'No se pudieron identificar las columnas esperadas (Dispositivo, Fecha de inicio, Horas motor, Horas en ralentí, Distancia, Velocidad máxima, Litros YPF) en ninguna hoja del archivo.' };
  }

  const { idx: headerIdx, mapa } = encontrado;
  const globalPeriodo = detectarPeriodoGlobal(rows, file.name);

  const dataRows = rows.slice(headerIdx+1).filter(r => r && mapa.dispositivo!==undefined && r[mapa.dispositivo] && String(r[mapa.dispositivo]).trim()!=='');

  const parsed = [];
  const errores = [];
  const vistosEnArchivo = new Set();
  const periodosDetectados = new Set();

  dataRows.forEach((r, i) => {
    const dispositivoRaw = r[mapa.dispositivo];
    // dispositivo_original: el texto EXACTO, siempre — es lo único que se muestra en pantalla.
    const dispositivoTexto = normalizarTextoConservandoMayus(dispositivoRaw);
    if(!dispositivoTexto){
      errores.push({ fila: headerIdx+2+i, motivo:'La columna Dispositivo viene vacía en esta fila', raw: dispositivoRaw });
      return;
    }
    // patente: clave interna para AGRUPAR el historial de un mismo vehículo,
    // aunque el texto completo cambie (ej. cambio de zona). Si no se puede
    // reconocer ninguna patente en el texto, se usa el texto completo como
    // clave (no bloquea la carga, solo pierde la agrupación en ese caso puntual).
    const patente = extraerPatenteClave(dispositivoTexto) || dispositivoTexto;
    const modelo = null, zona = null;
    const fecha_inicio = mapa.fecha_inicio!==undefined ? parseFechaInicio(r[mapa.fecha_inicio]) : null;

    let periodo, periodoLabel;
    if(globalPeriodo.periodo){
      periodo = globalPeriodo.periodo; periodoLabel = globalPeriodo.label;
    }else{
      const pf = periodoDeFecha(fecha_inicio);
      if(!pf){
        errores.push({ fila: headerIdx+2+i, motivo:'No se pudo determinar el período (sin metadata de período y sin fecha de inicio válida)', raw: dispositivoRaw });
        return;
      }
      periodo = pf.periodo; periodoLabel = pf.label;
    }
    periodosDetectados.add(periodo);

    const claveDup = patente+'|'+periodo;
    const row = {
      patente, modelo, zona, periodo, periodoLabel,
      dispositivo_original: dispositivoTexto,
      fecha_inicio,
      horas_motor: mapa.horas_motor!==undefined ? parseHoras(r[mapa.horas_motor]) : null,
      horas_ralenti: mapa.horas_ralenti!==undefined ? parseHoras(r[mapa.horas_ralenti]) : null,
      distancia_km: mapa.distancia_km!==undefined ? parseDistancia(r[mapa.distancia_km]) : null,
      velocidad_maxima: mapa.velocidad_maxima!==undefined ? parseVelocidad(r[mapa.velocidad_maxima]) : null,
      litros_ypf: mapa.litros_ypf!==undefined ? parseLitros(r[mapa.litros_ypf]) : null,
      _dup_en_archivo: vistosEnArchivo.has(claveDup),
    };
    vistosEnArchivo.add(claveDup);
    parsed.push(row);
  });

  const periodosOrdenados = [...periodosDetectados].sort();
  const periodoResumen = periodosOrdenados.length<=1
    ? (periodosOrdenados[0] ? periodoLabelFromKey(periodosOrdenados[0]) : null)
    : `${periodosOrdenados.length} períodos (${periodoLabelFromKey(periodosOrdenados[0])} – ${periodoLabelFromKey(periodosOrdenados[periodosOrdenados.length-1])})`;

  return {
    periodo: periodosOrdenados.length===1 ? periodosOrdenados[0] : null,
    periodoLabel: periodoResumen,
    periodos: periodosOrdenados,
    rows: parsed, errores, totalFilas: dataRows.length, sheetName,
  };
}

/* =========================================================================
   DATOS — capa Supabase
   ========================================================================= */
// Supabase devuelve como máximo 1000 filas por consulta si no se pagina
// explícitamente. Con más de 1000 reportes ya guardados, cualquier consulta
// "todos los períodos" se cortaba en las primeras 1000 sin avisar. Esta
// función pagina automáticamente hasta traer todas las filas, sin importar
// cuántas haya.
async function sbSelectPaginado(queryBuilder){
  const PAGE = 1000;
  let all = [], from = 0;
  while(true){
    const { data, error } = await queryBuilder().range(from, from+PAGE-1);
    if(error) throw error;
    all = all.concat(data || []);
    if(!data || data.length < PAGE) break;
    from += PAGE;
  }
  return all;
}
async function sbSelect(table, cols, filters){
  return sbSelectPaginado(() => {
    let q = state.sb.from(table).select(cols || '*');
    if(filters){
      for(const [k,v] of Object.entries(filters)){
        if(v!==undefined && v!==null && v!=='') q = q.eq(k, v);
      }
    }
    return q;
  });
}

// Descarga todas las filas pidiendo varias páginas A LA VEZ (en lugar de una
// detrás de otra). Primero pregunta cuántas filas hay, y después baja las
// páginas en paralelo, de a PARALELO por tanda. El orden por una columna
// única garantiza que ninguna fila se repita ni se pierda entre páginas.
async function sbSelectParalelo(table, cols, ordenCol){
  const PAGE = 1000, PARALELO = 6;
  const { count, error: errCount } = await state.sb.from(table).select(ordenCol, { count:'exact', head:true });
  if(errCount) throw errCount;
  const paginas = Math.max(1, Math.ceil((count||0) / PAGE));
  const resultados = new Array(paginas);
  for(let i=0; i<paginas; i+=PARALELO){
    const tanda = [];
    for(let j=i; j<Math.min(i+PARALELO, paginas); j++){
      tanda.push(
        state.sb.from(table).select(cols).order(ordenCol, { ascending:true }).range(j*PAGE, j*PAGE+PAGE-1)
          .then(({ data, error })=>{ if(error) throw error; resultados[j] = data || []; })
      );
    }
    await Promise.all(tanda);
  }
  let all = resultados.flat();
  // Si entre el conteo y la descarga se agregaron filas, se completan acá.
  let desde = paginas*PAGE;
  while(all.length >= desde){
    const { data, error } = await state.sb.from(table).select(cols).order(ordenCol, { ascending:true }).range(desde, desde+PAGE-1);
    if(error) throw error;
    all = all.concat(data || []);
    if(!data || data.length < PAGE) break;
    desde += PAGE;
  }
  return all;
}

// Caché en memoria: la base se descarga UNA sola vez y todas las hojas
// (General, Km, Litros, Indicadores, Histórico) y los filtros trabajan sobre
// esa copia. Antes, cada cambio de pestaña o de filtro volvía a bajar la
// tabla completa dos veces. La copia se descarta al importar una planilla o
// al tocar el botón Actualizar.
const cacheDatos = { reportes:null, vehiculos:null, promesa:null, cargadoEn:null };
function invalidarCacheDatos(){
  cacheDatos.reportes = null; cacheDatos.vehiculos = null; cacheDatos.promesa = null; cacheDatos.cargadoEn = null;
}
async function cargarDatosBase(){
  if(cacheDatos.reportes) return cacheDatos;
  if(!cacheDatos.promesa){
    cacheDatos.promesa = Promise.all([
      sbSelectParalelo('gps_reportes', '*, vehiculos(dominio, region, label)', 'id'),
      sbSelectParalelo('vehiculos', 'dominio, region, label, nombre_completo', 'dominio'),
    ]).then(([reportes, vehiculos])=>{
      cacheDatos.reportes = reportes; cacheDatos.vehiculos = vehiculos; cacheDatos.cargadoEn = new Date();
      return cacheDatos;
    }).catch(e=>{ cacheDatos.promesa = null; throw e; });
  }
  return cacheDatos.promesa;
}

async function fetchFilterOptions(){
  const { reportes, vehiculos } = await cargarDatosBase();
  const periodos = uniqBy(reportes, 'periodo').sort((a,b)=>b.periodo.localeCompare(a.periodo));
  const modelos = [...new Set([...vehiculos.map(v=>v.label), ...reportes.map(r=>r.modelo_periodo)].filter(Boolean))].sort();
  const zonas = [...new Set([...vehiculos.map(v=>v.region), ...reportes.map(r=>r.zona_periodo)].filter(Boolean))].sort();
  // "Dispositivos": cada texto EXACTO que apareció alguna vez en la columna
  // Dispositivo del Excel — igual que el autofiltro de una columna en Excel,
  // no un resumen por vehículo. Si un vehículo cambió de zona, sus dos
  // nombres históricos aparecen como dos opciones distintas.
  const vistos = new Set();
  const dispositivos = [];
  reportes.forEach(r=>{
    const texto = r.dispositivo_original;
    if(texto && !vistos.has(texto)){ vistos.add(texto); dispositivos.push(texto); }
  });
  dispositivos.sort((a,b)=>a.localeCompare(b));
  return { periodos, vehiculos, modelos, zonas, dispositivos };
}
function uniqBy(arr, key){
  const seen = new Set(); const out = [];
  for(const it of arr){ if(!seen.has(it[key])){ seen.add(it[key]); out.push(it); } }
  return out;
}

async function fetchReportesFiltrados(filters){
  const { reportes } = await cargarDatosBase();
  let rows = reportes.slice();
  if(filters.periodo && filters.periodo.length){
    const set = new Set(filters.periodo);
    rows = rows.filter(r => set.has(r.periodo));
  }
  if(filters.vehiculo && filters.vehiculo.length) rows = rows.filter(r => filters.vehiculo.includes(r.dispositivo_original));
  return rows;
}

function agregarKPIs(rows){
  const kmTotal = sumField(rows, 'distancia_km');
  const litrosTotal = sumField(rows, 'litros_ypf');
  const horasMotor = sumField(rows, 'horas_motor');
  const horasRalenti = sumField(rows, 'horas_ralenti');
  const velMax = rows.reduce((m,r)=> r.velocidad_maxima!==null && r.velocidad_maxima>m ? r.velocidad_maxima : m, 0);
  const kml = litrosTotal ? kmTotal/litrosTotal : null;
  const l100 = kmTotal ? litrosTotal/(kmTotal/100) : null;
  const vehiculosCount = new Set(rows.map(r=>r.vehiculo_dominio)).size;
  return { kmTotal, litrosTotal, horasMotor, horasRalenti, velMax, kml, l100, vehiculosCount };
}
function sumField(rows, f){
  return rows.reduce((s,r)=> s + (r[f]!==null && r[f]!==undefined ? Number(r[f]) : 0), 0);
}

function abrirMultiSelectPanel(id, options, selected, allLabel, onApply){
  cerrarMultiSelectPanels();
  const wrap = document.getElementById(id+'-wrap');
  if(!wrap) return;
  let temp = new Set(selected||[]);
  const panel = document.createElement('div');
  panel.className = 'ms-panel';

  wrap.appendChild(panel);

  const getItemCbs = () => [...panel.querySelectorAll('.ms-list input[type=checkbox]')];
  const syncAll = () => { const cbs=getItemCbs(); allCb.checked = cbs.length>0 && cbs.every(c=>c.checked); allCb.indeterminate = !allCb.checked && cbs.some(c=>c.checked); };
  syncAll();
  allCb.onchange = () => { getItemCbs().forEach(c=>{ c.checked = allCb.checked; }); allCb.indeterminate=false; };
  panel.querySelector('#'+id+'-list').addEventListener('change', (e)=>{ if(e.target.matches('input[type=checkbox]')) syncAll(); });
  panel.querySelector('#'+id+'-search').oninput = (e) => {

  panel.querySelector('#'+id+'-ok').onclick = (e) => {

  setTimeout(()=>{
    document.addEventListener('click', function h(){ panel.remove(); document.removeEventListener('click', h); }, { once:true });
  },0);
}

/* =========================================================================
   PIVOT — tablas "Dispositivo x Mes" (Km recorridos / Litros consumidos)
   ========================================================================= */
// Ningún vehículo de la flota recorre esto en un mes real (la mayoría ni
// llega a 10.000 km) — cualquier registro por encima queda claramente marcado
// como un error de carga (dígito de más, unidad equivocada, etc.). Se separa
// de los totales para no ensuciar los KPIs, pero NUNCA se borra ni se toca
// en Supabase: solo se avisa para que se corrija en el origen.
const MAX_KM_MENSUAL = 20000;
function marcarSospechosos(rows){
  const esSospechoso = r => r.distancia_km!==null && r.distancia_km!==undefined && r.distancia_km > MAX_KM_MENSUAL;
  return {
    validas: rows.filter(r => !esSospechoso(r)),
    sospechosas: rows.filter(esSospechoso),
  };
}
function warningSospechososHtml(sospechosas){
  if(!sospechosas.length) return '';
  const ordenadas = [...sospechosas].sort((a,b)=> (b.distancia_km||0)-(a.distancia_km||0));
  return `<details class="km-alert">
    <summary>
      <span class="warn-icon">${icon('alert')}</span>
      <strong style="color:var(--red)">${sospechosas.length} registro(s) con más de ${fmtNum(MAX_KM_MENSUAL,0)} km en un mes, excluido(s) de los totales</strong>
      <span class="km-alert-toggle"><span class="t-ver">Ver detalle ▾</span><span class="t-ocultar">Ocultar ▴</span></span>
    </summary>
    <div class="km-alert-body">
      <p class="muted">Son errores de carga del GPS. No se modificó nada en Supabase: corregí estas filas en la tabla <code>gps_reportes</code>.</p>
      <div class="km-alert-list"><table>
        <thead><tr><th>Dispositivo</th><th>Período</th><th class="num">Km cargados</th></tr></thead>
        <tbody>${ordenadas.map(r=>`<tr>
          <td>${esc(r.dispositivo_original || r.vehiculo_dominio || '—')}</td>
          <td>${esc(r.periodo_label || r.periodo || '—')}</td>
          <td class="num">${fmtNum(r.distancia_km,0)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
  </details>`;
}

// Limita la altura del contenedor para que se vean el encabezado, la fila
// Total y hasta 15 vehículos; con más, aparece la barra de desplazamiento.
// Se mide la altura real de las filas para que funcione con cualquier zoom.
const PIVOT_FILAS_VISIBLES = 15;
function ajustarAlturaPivot(containerId){
  const cont = document.getElementById(containerId);
  if(!cont) return;
  const table = cont.querySelector('table');
  if(!table){ cont.style.maxHeight=''; return; }
  const head = table.tHead ? table.tHead.getBoundingClientRect().height : 0;
  cont.style.setProperty('--pivot-head-h', head + 'px');
  const filas = [...table.tBodies[0].rows];
  const extra = table.querySelector('tr.pivot-total-row') ? 1 : 0; // fila Total fija
  const visibles = filas.slice(0, PIVOT_FILAS_VISIBLES + extra);
  const alto = visibles.reduce((acc,tr)=> acc + tr.getBoundingClientRect().height, head);
  const hayScrollX = cont.scrollWidth > cont.clientWidth;
  const barra = hayScrollX ? (cont.offsetHeight - cont.clientHeight || 12) : 0;
  cont.style.maxHeight = filas.length > PIVOT_FILAS_VISIBLES + extra ? Math.ceil(alto + barra + 2) + 'px' : '';
}

const MESES_ABBR = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
// Formato compacto para el eje de los gráficos: "ENE-25".
function periodoLabelCompacta(p){
  if(!p) return '';
  const [y,m] = p.split('-');
  return `${MESES_ABBR[parseInt(m,10)-1].toUpperCase()}-${y.slice(-2)}`;
}
function periodoLabelCorta(p){
  if(!p) return '';
  const [y,m] = p.split('-');
  return `${MESES_ABBR[parseInt(m,10)-1]}.-${y}`;
}
// Agrupa "rows" por dispositivo y arma, para cada uno, el total general y el
// valor por período, usando la función "aggregate" que se le pase (sumar km,
// sumar litros, o litros/100km) — así se reutiliza la misma estructura para
// las tres tablas tipo Excel dinámico.
function buildPivot(rows, opts){
  const aggregate = opts.aggregate;
  const periodos = [...new Set(rows.map(r=>r.periodo).filter(Boolean))].sort();
  // Se agrupa por el texto EXACTO de "Dispositivo" tal como se cargó cada
  // reporte (dispositivo_original) — igual que el filtro de dispositivos y
  // que la tabla "Detalle por vehículo" de la hoja General. Nunca se agrupa
  // por el vehículo/patente subyacente: si una unidad cambió de zona (ej.
  // "AF220RZ PARTNER REDES" -> "AF220RZ PARTNER CORDOBA"), cada nombre debe
  // quedar como una fila separada, respetando la carga real en Supabase.
  const byDevice = new Map();
  rows.forEach(r=>{
    const zona = r.zona_periodo || r.vehiculos?.region;
    const modelo = r.modelo_periodo || r.vehiculos?.label;
    const key = r.dispositivo_original || nombreCompletoConZona(r.vehiculo_dominio, modelo, zona) || r.vehiculo_dominio || '—';
    if(!byDevice.has(key)) byDevice.set(key, []);
    byDevice.get(key).push(r);
  });
  const devices = [...byDevice.entries()].map(([nombre, drows])=>{
    const porPeriodo = {};
    periodos.forEach(p=>{
      const subset = drows.filter(r=>r.periodo===p);
      porPeriodo[p] = subset.length ? aggregate(subset) : null;
    });
    return { dominio: drows[0]?.vehiculo_dominio || nombre, nombre, total: aggregate(drows), porPeriodo };
  });
  devices.sort((a,b)=> (b.total||0)-(a.total||0));
  const totalPorPeriodo = {};
  periodos.forEach(p=>{ totalPorPeriodo[p] = aggregate(rows.filter(r=>r.periodo===p)); });
  return { periodos, devices, totalGeneral: aggregate(rows), totalPorPeriodo };
}
function pivotTableHtml(pivot, {decimales=0, searchQuery='', etiquetaPeriodo=periodoLabelCorta}={}){
  const q = (searchQuery||'').toLowerCase();
  const filtered = q ? pivot.devices.filter(d=>(d.nombre||d.dominio||'').toLowerCase().includes(q)) : pivot.devices;
  return `<table class="pivot-table">
    <thead><tr>
      <th class="sticky-col">Dispositivo</th>
      <th class="num">Total</th>
      ${pivot.periodos.map(p=>`<th class="num" title="${esc(periodoLabelCorta(p))}">${esc(etiquetaPeriodo(p))}</th>`).join('')}
    </tr></thead>
    <tbody>
      <tr class="pivot-total-row">
        <td class="sticky-col">Total</td>
        <td class="num">${fmtNum(pivot.totalGeneral,decimales)}</td>
        ${pivot.periodos.map(p=>`<td class="num">${fmtNum(pivot.totalPorPeriodo[p],decimales)}</td>`).join('')}
      </tr>
      ${filtered.length ? filtered.map(d=>`<tr data-dom="${esc(d.dominio)}">
        <td class="sticky-col device-name">${esc(d.nombre||d.dominio)}</td>
        <td class="num">${fmtNum(d.total,decimales)}</td>
        ${pivot.periodos.map(p=>`<td class="num">${(d.porPeriodo[p]!==null&&d.porPeriodo[p]!==undefined)?fmtNum(d.porPeriodo[p],decimales):'—'}</td>`).join('')}
      </tr>`).join('') : `<tr><td class="sticky-col" colspan="${2+pivot.periodos.length}"><div class="empty">Sin resultados.</div></td></tr>`}
    </tbody>
  </table>`;
}
function exportarPivotCSV(pivot, filename, dec){
  const headers = ['Dispositivo','Total', ...pivot.periodos.map(periodoLabelCorta)];
  const lines = [headers.join(';')];
  lines.push(['Total', fmtNum(pivot.totalGeneral,dec), ...pivot.periodos.map(p=>fmtNum(pivot.totalPorPeriodo[p],dec))].join(';'));
  pivot.devices.forEach(d=>{
    lines.push([
      d.nombre||d.dominio, fmtNum(d.total,dec),
      ...pivot.periodos.map(p=>(d.porPeriodo[p]!==null&&d.porPeriodo[p]!==undefined)?fmtNum(d.porPeriodo[p],dec):'')
    ].map(v=>String(v).replace(/;/g,',')).join(';'));
  });
  const csv = '\uFEFF' + lines.join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${filename}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
