  };
}

/* ---------- Importación de la planilla YPF ---------- */
// Encabezados de la hoja "ReporteConsumos" (se comparan sin tildes y en minúscula).
const YPF_HEADER_ALIASES = {
  fecha:              ['fecha','fecha hora','fecha y hora'],
  contrato:           ['contrato'],
  subcuenta:          ['subcuenta'],
  centro_costo:       ['centro costo','centro de costo'],
  establecimiento:    ['establecimiento','estacion'],
  domicilio:          ['domicilio'],
  localidad:          ['localidad'],
  provincia:          ['provincia'],
  tarjeta:            ['tarjeta','nro tarjeta'],
  conductor:          ['conductor'],
  conductor_tipo_doc: ['tipo identificacion conductor'],
  conductor_nro_doc:  ['nro identificacion conductor'],
  patente:            ['identificacion tarjeta','patente','dominio'],
  odometro:           ['odometro','kilometraje'],
  origen:             ['origen de transaccion','origen'],
  facturable:         ['trx facturable','facturable'],
  remito:             ['remito','nro remito'],
  producto:           ['producto'],
  litros:             ['litros unidades','litros','cantidad'],
  precio_pvp:         ['precio pvp establecimiento'],
  importe_pvp:        ['imp tot pvp establecimiento'],
  precio_yer:         ['precio yer'],
  importe_yer:        ['imp tot yer'],
  divisa:             ['divisa'],
  iva:                ['iva'],
  imp_co2:            ['imp co2'],
  tasa_vial:          ['tasa vial'],
  imp_comb_liq:       ['imp comb liq'],
  factura:            ['factura'],
  extracto:           ['extracto'],
};
const YPF_OBLIGATORIOS = ['fecha','remito','patente','litros'];

function ypfDetectarEncabezados(rows){
  for(let i=0; i<Math.min(rows.length, 30); i++){
    const r = rows[i] || [];
    const mapa = {};
    r.forEach((celda, j)=>{
      const t = normalizarTexto(celda);
      if(!t) return;
      for(const [campo, alias] of Object.entries(YPF_HEADER_ALIASES)){
        if(mapa[campo]===undefined && alias.includes(t)){ mapa[campo] = j; break; }
      }
    });
    if(YPF_OBLIGATORIOS.every(c=>mapa[c]!==undefined)) return { idx:i, mapa };
  }
  return null;
}
function ypfTexto(raw){
  if(raw===null || raw===undefined) return null;
  const s = String(raw).trim().replace(/\s+/g,' ');
  return s==='' ? null : s;
}
function ypfNumero(raw){
  if(raw===null || raw===undefined || raw==='') return null;
  if(typeof raw === 'number') return isNaN(raw) ? null : raw;
  let s = String(raw).trim().replace(/[$\s]/g,'');
  if(s==='') return null;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s) || /^-?\d+,\d+$/.test(s)) s = s.replace(/\./g,'').replace(',','.'); // formato 1.234,56
  else s = s.replace(/,/g,'');                                                                                 // formato 1,234.56
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function ypfFechaHora(raw){
  if(raw===null || raw===undefined || raw==='') return null;
  if(raw instanceof Date && !isNaN(raw)){
    return `${raw.getFullYear()}-${pad2(raw.getMonth()+1)}-${pad2(raw.getDate())} ${pad2(raw.getHours())}:${pad2(raw.getMinutes())}:${pad2(raw.getSeconds())}`;
  }
  if(typeof raw === 'number'){
    const d = new Date(EXCEL_EPOCH_MS + Math.round(raw*86400) * 1000);
    return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}`;
  }
  const s = String(raw).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])} ${pad2(m[4]||0)}:${pad2(m[5]||0)}:${pad2(m[6]||0)}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2})(?::(\d{2}))?)?/);
  if(m) return `${m[1]}-${m[2]}-${m[3]} ${m[4]||'00'}:${m[5]||'00'}:${m[6]||'00'}`;
  return null;
}
function ypfNormalizarPatente(raw){
  const t = normalizarTextoConservandoMayus(raw).toUpperCase();
  if(!t) return null;
  return extraerPatenteClave(t) || t.replace(/\s+/g,'');
}

async function parseExcelYpf(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array' });
  let enc = null, rows = null, sheetName = null;
  for(const name of wb.SheetNames){
    const r = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:null });
    const e = ypfDetectarEncabezados(r);
    if(e){ enc = e; rows = r; sheetName = name; break; }
  }
  if(!enc){
    return { errorGeneral:'No se encontraron las columnas de YPF en Ruta (FECHA, REMITO, IDENTIFICACION TARJETA, LITROS UNIDADES) en ninguna hoja del archivo. Descargá el "Reporte de consumos" desde YPF en Ruta y volvé a intentar.' };
  }
  const { idx, mapa } = enc;
  const v = (r, campo) => mapa[campo]!==undefined ? r[mapa[campo]] : null;
  const dataRows = rows.slice(idx+1);
  const parsed = [], errores = [], vistos = new Set();
  let totalFilas = 0, fechaMin = null, fechaMax = null;

  dataRows.forEach((r, i)=>{
    if(!r || r.every(c=>c===null || String(c).trim()==='')) return;
    totalFilas++;
    const fila = idx + 2 + i;
    const remito = ypfTexto(v(r,'remito'));
    const fecha = ypfFechaHora(v(r,'fecha'));
    const patenteOriginal = ypfTexto(v(r,'patente'));
    const litros = ypfNumero(v(r,'litros'));
    if(!remito){ errores.push({ fila, motivo:'Sin número de remito' }); return; }
    if(!fecha){ errores.push({ fila, remito, motivo:`Fecha no reconocida ("${ypfTexto(v(r,'fecha'))||''}")` }); return; }
    if(!patenteOriginal){ errores.push({ fila, remito, motivo:'Sin patente en IDENTIFICACION TARJETA' }); return; }
    if(litros===null){ errores.push({ fila, remito, motivo:'Sin litros' }); return; }
    if(vistos.has(remito)){ errores.push({ fila, remito, motivo:'Remito repetido dentro del archivo' }); return; }
    vistos.add(remito);
    if(!fechaMin || fecha < fechaMin) fechaMin = fecha;
    if(!fechaMax || fecha > fechaMax) fechaMax = fecha;
    const fact = ypfTexto(v(r,'facturable'));
    parsed.push({
      remito, fecha, periodo: fecha.slice(0,7),
      vehiculo_dominio: ypfNormalizarPatente(patenteOriginal),
      patente_original: patenteOriginal,
      tarjeta: ypfTexto(v(r,'tarjeta')),
      contrato: ypfTexto(v(r,'contrato')),
      subcuenta: ypfTexto(v(r,'subcuenta')),
      centro_costo: ypfTexto(v(r,'centro_costo')),
      establecimiento: ypfTexto(v(r,'establecimiento')),
      domicilio: ypfTexto(v(r,'domicilio')),
      localidad: ypfTexto(v(r,'localidad')),
      provincia: ypfTexto(v(r,'provincia')),
      conductor: ypfTexto(v(r,'conductor')),
      conductor_tipo_doc: ypfTexto(v(r,'conductor_tipo_doc')),
      conductor_nro_doc: YPF_GUARDAR_DNI ? ypfTexto(v(r,'conductor_nro_doc')) : null,
      odometro: ypfNumero(v(r,'odometro')),
      origen: ypfTexto(v(r,'origen')),
      facturable: fact===null ? null : /^s/i.test(fact),
      producto: ypfTexto(v(r,'producto')),
      litros,
      precio_pvp: ypfNumero(v(r,'precio_pvp')),
      importe_pvp: ypfNumero(v(r,'importe_pvp')),
      precio_yer: ypfNumero(v(r,'precio_yer')),
      importe_yer: ypfNumero(v(r,'importe_yer')),
      divisa: ypfTexto(v(r,'divisa')),
      iva: ypfNumero(v(r,'iva')),
      imp_co2: ypfNumero(v(r,'imp_co2')),
      tasa_vial: ypfNumero(v(r,'tasa_vial')),
      imp_comb_liq: ypfNumero(v(r,'imp_comb_liq')),
      factura: ypfTexto(v(r,'factura')),
      extracto: ypfTexto(v(r,'extracto')),
    });
  });
  return { rows:parsed, errores, totalFilas, sheetName, fechaMin, fechaMax };
}

// Campos que se comparan contra lo guardado para decidir "actualizar" o "sin cambios".
const YPF_CAMPOS_COMPARAR = ['fecha','vehiculo_dominio','producto','litros','importe_yer','importe_pvp','odometro','conductor','establecimiento','factura','extracto'];
const YPF_NOMBRE_CAMPO = { fecha:'fecha', vehiculo_dominio:'patente', producto:'producto', litros:'litros', importe_yer:'importe', importe_pvp:'importe PVP', odometro:'odómetro', conductor:'conductor', establecimiento:'estación', factura:'factura', extracto:'extracto' };
const YPF_CAMPOS_NUM = new Set(['litros','importe_yer','importe_pvp','odometro']);
function ypfIgual(campo, a, b){
  if(campo==='fecha') return String(a||'').replace('T',' ').slice(0,19) === String(b||'').replace('T',' ').slice(0,19);
  if(YPF_CAMPOS_NUM.has(campo)){
    if(a===null || a===undefined || b===null || b===undefined) return (a??null)===(b??null);
    return Math.abs(Number(a) - Number(b)) < 0.005;
  }
  return String(a??'').trim() === String(b??'').trim();
}

    </div>

      <div class="muted" style="margin-top:4px;font-size:12px">Reporte de consumos de YPF en Ruta (.xlsx). Se puede volver a subir un período ya cargado: cada ticket se identifica por su remito y no se duplica.</div>

  bg.querySelector('#ypfi-close').onclick = cerrar;

  const dz = bg.querySelector('#ypfi-dz'), input = bg.querySelector('#ypfi-file');
  dz.onclick = () => input.click();
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add('drag'); }));

  dz.addEventListener('drop', e=>{ if(e.dataTransfer.files[0]) ypfHandleFile(e.dataTransfer.files[0]); });
  input.onchange = e=>{ if(e.target.files[0]) ypfHandleFile(e.target.files[0]); };

    el.innerHTML = ypfEsErrorDeTablas(e)
      ? '<div class="empty">Faltan las tablas del Reporte YPF: corré <code>ypf_schema.sql</code> en Supabase antes de cargar.</div>'
      : `<div class="empty">No se pudo cargar el historial (${esc(e.message||e)}).</div>`;
  }
}

async function ypfHandleFile(file){
  const resultEl = document.getElementById('ypfi-result');
  resultEl.innerHTML = `<div class="empty"><span class="spin"></span> Leyendo planilla…</div>`;
  try{
    const hash = await hashFile(file);
    const parsed = await parseExcelYpf(file);
    if(parsed.errorGeneral){
      resultEl.innerHTML = `<div class="panel"><div class="panel-body" style="padding-top:18px"><strong style="color:var(--red)">${esc(parsed.errorGeneral)}</strong></div></div>`;
      return;
    }
    if(!parsed.rows.length && !parsed.errores.length){
      resultEl.innerHTML = `<div class="panel"><div class="panel-body" style="padding-top:18px"><strong style="color:var(--red)">La planilla no tiene tickets debajo del encabezado.</strong></div></div>`;
      return;
    }
    const { data: yaExiste, error: errHash } = await state.sb.from('ypf_importaciones').select('nombre_archivo, fecha_carga').eq('hash_archivo', hash).eq('estado','completado').limit(1);
    if(errHash) throw errHash;
    if(yaExiste && yaExiste.length){
      const seguir = await confirmModal('Esta planilla ya se cargó',
        `Se cargó el ${new Date(yaExiste[0].fecha_carga).toLocaleString('es-AR')} como "${yaExiste[0].nombre_archivo}". Podés cancelar o compararla igual contra lo guardado.`,
        'Comparar igual');
      if(!seguir){ resultEl.innerHTML = ''; return; }
    }

    resultEl.innerHTML = `<div class="empty"><span class="spin"></span> Comparando ${fmtNum(parsed.rows.length,0)} tickets con Supabase…</div>`;
    const existentes = parsed.rows.length ? await sbSelectPaginado(()=>
      state.sb.from('ypf_consumos').select('remito, ' + YPF_CAMPOS_COMPARAR.join(', '))
        .gte('fecha', parsed.fechaMin).lte('fecha', parsed.fechaMax).order('remito', { ascending:true })
    ) : [];
    const porRemito = new Map(existentes.map(e=>[e.remito, e]));
    const preview = parsed.rows.map(row=>{
      const prev = porRemito.get(row.remito);
      if(!prev) return { row, estado:'nuevo' };
      const diffs = YPF_CAMPOS_COMPARAR.filter(c=>!ypfIgual(c, prev[c], row[c])).map(c=>({ campo:c, antes:prev[c], despues:row[c] }));
      return { row, estado: diffs.length ? 'actualizar' : 'sin-cambios', diffs };
    });
    state.importYpf = { file, hash, parsed, preview };
    ypfRenderPreview(resultEl);
  }catch(e){
    console.error(e);
    resultEl.innerHTML = `<div class="panel"><div class="panel-body" style="padding-top:18px"><strong style="color:var(--red)">No se pudo procesar la planilla.</strong><p class="muted">${esc(ypfEsErrorDeTablas(e) ? 'Faltan las tablas del Reporte YPF: corré ypf_schema.sql en Supabase.' : (e.message||e))}</p></div></div>`;
  }
}

function ypfRenderPreview(resultEl){
  const { file, parsed, preview } = state.importYpf;
  const c = { nuevo:0, actualizar:0, 'sin-cambios':0 };
  preview.forEach(p=>c[p.estado]++);
  const aGrabar = c.nuevo + c.actualizar;
  const vehiculos = new Set(parsed.rows.map(r=>r.vehiculo_dominio)).size;
  const fd = s => s ? s.slice(0,10).split('-').reverse().join('/') : '—';
  const cambios = preview.filter(p=>p.estado==='actualizar');
  const MAX = 200;
  const filasDetalle = [
    ...parsed.errores.map(e=>`<tr><td>${esc(e.remito||'—')}</td><td>Fila ${e.fila}</td><td>${badgeEstado('error')}</td><td><span class="muted">${esc(e.motivo)}</span></td></tr>`),
    ...cambios.map(p=>`<tr><td>${esc(p.row.remito)}</td><td>${esc(p.row.patente_original)}</td><td>${badgeEstado('actualizar')}</td><td>${p.diffs.map(d=>`<span class="diff-old">${esc(String(d.antes ?? '—'))}</span> → <span class="diff-new">${esc(String(d.despues ?? '—'))}</span> <span class="muted">(${esc(YPF_NOMBRE_CAMPO[d.campo]||d.campo)})</span>`).join('<br>')}</td></tr>`),
  ];
  resultEl.innerHTML = `
    <div class="panel" style="margin-top:16px">
      <div class="panel-head"><div class="panel-head-left"><span class="ic">${icon('search')}</span><h2>Planilla detectada</h2></div></div>
      <div class="panel-body">
        <p style="margin:0"><strong>Archivo:</strong> ${esc(file.name)} &nbsp;·&nbsp; <strong>Tickets:</strong> ${fmtNum(parsed.totalFilas,0)} &nbsp;·&nbsp; <strong>Desde</strong> ${fd(parsed.fechaMin)} <strong>hasta</strong> ${fd(parsed.fechaMax)} &nbsp;·&nbsp; <strong>Vehículos:</strong> ${fmtNum(vehiculos,0)}</p>
        <div class="summary-strip">
          <div class="summary-pill" style="border-color:#cdeedb"><div class="n" style="color:var(--green)">${fmtNum(c.nuevo,0)}</div><div class="l">Nuevos</div></div>
          <div class="summary-pill" style="border-color:#f6e2b8"><div class="n" style="color:var(--amber-dark)">${fmtNum(c.actualizar,0)}</div><div class="l">Actualizar</div></div>
          <div class="summary-pill"><div class="n" style="color:var(--slate-600)">${fmtNum(c['sin-cambios'],0)}</div><div class="l">Sin cambios</div></div>
          <div class="summary-pill" style="border-color:#f3cec5"><div class="n" style="color:var(--red)">${fmtNum(parsed.errores.length,0)}</div><div class="l">Con errores (no se cargan)</div></div>
        </div>
        ${filasDetalle.length ? `<div class="table-wrap" style="max-height:300px;overflow-y:auto">
          <table><thead><tr><th>Remito</th><th>Patente / fila</th><th>Estado</th><th>Detalle</th></tr></thead>
          <tbody>${filasDetalle.slice(0,MAX).join('')}</tbody></table>
        </div>${filasDetalle.length>MAX ? `<p class="muted" style="font-size:12px">Se muestran ${MAX} de ${fmtNum(filasDetalle.length,0)} filas con cambios o errores.</p>` : ''}` : ''}
        <div style="display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap">
          <button class="btn btn-secondary" id="ypfi-cancelar">Cancelar</button>
          <button class="btn btn-primary" id="ypfi-confirmar" ${aGrabar===0?'disabled':''}>Confirmar importación</button>
          <span class="muted" id="ypfi-progreso" style="font-size:12px">${aGrabar===0 ? 'No hay nada nuevo para guardar.' : `Se guardarán ${fmtNum(aGrabar,0)} tickets.`}</span>
        </div>
      </div>
    </div>`;
  document.getElementById('ypfi-cancelar').onclick = () => { state.importYpf = null; resultEl.innerHTML = ''; document.getElementById('ypfi-file').value = ''; };
  document.getElementById('ypfi-confirmar').onclick = () => ypfEjecutarImportacion(resultEl);
}

async function ypfEjecutarImportacion(resultEl){
  const btn = document.getElementById('ypfi-confirmar');
  const prog = document.getElementById('ypfi-progreso');
  const imp = state.importYpf;
  const { file, hash, parsed, preview } = imp;
  const aGrabar = preview.filter(p=>p.estado==='nuevo' || p.estado==='actualizar');
  const nuevos = preview.filter(p=>p.estado==='nuevo').length;
  const actualizados = aGrabar.length - nuevos;
  const sinCambios = preview.length - aGrabar.length;
  btn.disabled = true; btn.textContent = 'Importando…';
  document.getElementById('ypfi-cancelar').disabled = true;
  imp.importando = true;
  let importacionId = null;
  try{
    const { data: importacion, error: errIni } = await state.sb.from('ypf_importaciones').insert({
      nombre_archivo: file.name, hash_archivo: hash,
      fecha_desde: parsed.fechaMin ? parsed.fechaMin.slice(0,10) : null,
      fecha_hasta: parsed.fechaMax ? parsed.fechaMax.slice(0,10) : null,
      total_registros: parsed.totalFilas, registros_error: parsed.errores.length, estado:'procesando',
    }).select('id').single();
    if(errIni) throw errIni;
    importacionId = importacion.id;

    for(let i=0; i<aGrabar.length; i+=YPF_LOTE_UPSERT){
      const lote = aGrabar.slice(i, i+YPF_LOTE_UPSERT).map(p=>({ ...p.row, importacion_id: importacionId }));
      const { error } = await state.sb.from('ypf_consumos').upsert(lote, { onConflict:'remito' });
      if(error) throw error;
      prog.textContent = `Guardados ${fmtNum(Math.min(i+YPF_LOTE_UPSERT, aGrabar.length),0)} de ${fmtNum(aGrabar.length,0)} tickets…`;
    }

    await state.sb.from('ypf_importaciones').update({
      registros_nuevos: nuevos, registros_actualizados: actualizados, registros_sin_cambios: sinCambios, estado:'completado',
    }).eq('id', importacionId);

    invalidarCacheYpf();
    state.ypfConsulta = null;   // al volver a la hoja se muestra el mes de la última carga
    state.importYpf = null;
    resultEl.innerHTML = '';
    document.getElementById('ypfi-file').value = '';
    toast(`Planilla YPF cargada: ${fmtNum(nuevos,0)} nuevos, ${fmtNum(actualizados,0)} actualizados, ${fmtNum(sinCambios,0)} sin cambios.`, 'success');
    ypfLoadHistorial();
    if(state.view === 'ypf') renderView();
  }catch(e){
    console.error(e);
    if(importacionId) await state.sb.from('ypf_importaciones').update({ estado:'error' }).eq('id', importacionId);
    imp.importando = false;
    toast('No se pudo completar la importación: ' + (e.message||e) + '. Los lotes ya guardados quedan; podés volver a cargar la misma planilla para completar.', 'error');
    btn.disabled = false; btn.textContent = 'Reintentar importación';
    document.getElementById('ypfi-cancelar').disabled = false;
  }
}

/* ---------- Modal de confirmación genérico ---------- */
function confirmModal(title, body, confirmLabel){
  return new Promise(resolve=>{
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal">
      <h3>${esc(title)}</h3>
      <p>${esc(body)}</p>
      <div class="actions">
        <button class="btn btn-secondary" id="m-cancel">Cancelar</button>
        <button class="btn btn-primary" id="m-ok">${esc(confirmLabel||'Continuar')}</button>
      </div>
    </div>`;
    document.body.appendChild(bg);
    bg.querySelector('#m-cancel').onclick = () => { bg.remove(); resolve(false); };
    bg.querySelector('#m-ok').onclick = () => { bg.remove(); resolve(true); };
  });
}

/* ---------------------------------------------------------------------
   PWA — instalar en escritorio / agregar a pantalla de inicio
   --------------------------------------------------------------------- */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('btn-install');
  if(btn) btn.style.display = 'flex';
});
window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; });
function bindInstallButton(){
  const btn = document.getElementById('btn-install-icon');
  if(!btn) return;
  if(deferredInstallPrompt) btn.style.display = 'flex';
  btn.onclick = async () => {
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    btn.style.display = 'none';
  };
}
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* sin service worker no rompe la app, solo no queda instalable/offline */ });
  });
}

/* ---------------------------------------------------------------------
   Bootstrap
   --------------------------------------------------------------------- */
state.sb = initSupabase();
render();
</script>
