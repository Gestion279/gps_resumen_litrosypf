<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consumos de vehículos</title>

<!-- PWA: instalable en escritorio y en pantalla de inicio del celular -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d9488">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Consumos">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    /* Paleta pedida: navy → verde claro */
    --p1:#1B4079; --p2:#4D7C8A; --p3:#7F9C96; --p4:#8FAD88; --p5:#C7DB94;

    --teal-700:#142f5c;
    --teal-600:#1B4079;
    --teal-500:#2d5a94;
    --teal-50:#eef1f6;
    --navy-950:#132a4d;
    --navy-900:#152238;
    --navy-800:#1c2e4a;
    --slate-50:#f6f7f9;
    --slate-100:#eceef2;
    --slate-200:#dde1e8;
    --slate-400:#8b93a3;
    --slate-600:#535c6c;
    --slate-800:#2a3242;
    --amber:#e6a91b;
    --amber-dark:#b8820e;
    --green:#2f9e5b;
    --red:#c0432f;
    --gray-mid:#8b93a3;

    /* tintes de las tarjetas KPI, derivados de la paleta de arriba */
    --kpi-blue-bg:#D1D9E4;   --kpi-blue-fg:#1B4079;
    --kpi-teal-bg:#DBE5E8;   --kpi-teal-fg:#3f6673;
    --kpi-violet-bg:#E5EBEA; --kpi-violet-fg:#5b746e;
    --kpi-green-bg:#E9EFE7;  --kpi-green-fg:#5f7a58;
    --kpi-amber-bg:#F4F8EA;  --kpi-amber-fg:#78904a;
    --kpi-rose-bg:#DCE3ED;   --kpi-rose-fg:#2d5a94;

    --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
    --radius: 10px;
    --radius-sm: 7px;
    --shadow-card: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-ui);
    background:#f4f6f8;
    color:var(--slate-800);
    font-size:14px;
    line-height:1.45;
  }
  @font-face{font-family:"Inter";src:local("Inter");}
  a{color:inherit;}
  button{font-family:inherit;font-size:inherit;cursor:pointer;}
  input,select{font-family:inherit;font-size:inherit;}

  /* ---------- Layout shell (tabs arriba, sin sidebar) ---------- */
  #app{display:flex;flex-direction:column;min-height:100vh;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    padding:14px 26px;border-bottom:1px solid var(--slate-200);background:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .topbar-titles{display:flex;align-items:center;gap:10px;}
  .topbar-titles .pin{
    width:36px;height:36px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none;
  }
  .topbar h1{font-size:16.5px;margin:0;font-weight:700;color:var(--navy-950);}
  .topbar .meta{font-size:12px;color:var(--slate-400);}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--slate-200);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--slate-600);flex:none;position:relative;
  }
  .icon-btn:hover{background:var(--slate-50);}
  .icon-btn svg{width:16px;height:16px;}
  .content{padding:20px 26px 60px 26px;flex:1;}

  /* ---------- Tabs (reemplazan al sidebar) ---------- */
  .tabbar{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--slate-200);padding:0 26px;overflow-x:auto;}
  .tab-item{
    padding:13px 16px;font-size:13.5px;font-weight:600;color:var(--slate-600);background:none;border:none;
    border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;
  }
  .tab-item:hover{color:var(--navy-950);}
  .tab-item.active{color:var(--teal-600);border-bottom-color:var(--teal-600);}

  /* ---------- Filters (botones rectangulares, estilo hoja de cálculo) ---------- */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .filter-pill{
    position:relative;display:flex;align-items:center;border:1px solid var(--slate-200);
    border-radius:var(--radius-sm);background:#fff;padding:0 12px;height:38px;
  }
  .filter-pill select{
    border:none;background:transparent;padding:0;color:var(--slate-800);
    min-width:120px;font-weight:600;font-size:13px;appearance:none;-webkit-appearance:none;
  }
  .filter-pill select:focus{outline:none;}
  .filter-pill.active-filter{border-color:var(--teal-600);}

  /* ---------- KPI cards: todas en una sola fila ---------- */
  .kpi-grid{display:flex;flex-wrap:nowrap;gap:12px;margin-bottom:22px;overflow-x:auto;padding-bottom:4px;}
  .kpi-card{
    border-radius:var(--radius);padding:14px 16px;position:relative;background:#fff;
    box-shadow:var(--shadow-card);flex:1 0 150px;min-width:150px;
  }
  .kpi-card.tint .kpi-icon{background:rgba(255,255,255,.6);}
  .kpi-card .kpi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
  .kpi-icon{
    width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;
  }
  .kpi-icon svg{width:17px;height:17px;}
  .kpi-trend{
    display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;
  }
  .kpi-trend.up{background:#e6f9ed;color:#16a34a;}
  .kpi-trend.down{background:#fdeeec;color:#dc4c3f;}
  .kpi-trend svg{width:10px;height:10px;}
  .kpi-trend-caption{font-size:10px;color:var(--slate-400);text-align:right;margin-top:2px;}
  .kpi-card .label{font-size:12px;color:var(--slate-600);margin-bottom:4px;font-weight:600;}
  .kpi-card .value{font-size:22px;font-weight:700;color:var(--navy-950);letter-spacing:-.2px;}
  .kpi-card .unit{font-size:12px;color:var(--slate-400);margin-left:3px;font-weight:600;}
  .kpi-card .caption{font-size:11px;color:var(--slate-400);margin-top:5px;}

  /* ---------- Cards / panels ---------- */
  .panel{background:#fff;border-radius:var(--radius);margin-bottom:22px;box-shadow:var(--shadow-card);}
  .panel-head{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .panel-head-left{display:flex;align-items:center;gap:10px;}
  .panel-head-left .ic{
    width:30px;height:30px;border-radius:9px;background:var(--teal-50);color:var(--teal-600);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .panel-head-left .ic svg{width:15px;height:15px;}
  .panel-head h2{font-size:14.5px;margin:0;font-weight:700;color:var(--navy-950);}
  .panel-head .sub{font-size:11.5px;color:var(--slate-400);margin-top:1px;}
  .panel-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .panel-body{padding:0 18px 18px 18px;}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;font-size:11px;color:var(--slate-400);font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:10px 12px;border-bottom:1px solid var(--slate-100);white-space:nowrap;
  }
  th .sort-ic{display:inline-block;width:10px;height:10px;margin-left:3px;opacity:.5;vertical-align:middle;}
  td{padding:11px 12px;border-bottom:1px solid var(--slate-100);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right;}
  .table-wrap{overflow-x:auto;}
  .row-click{cursor:pointer;}
  .row-click:hover{background:var(--slate-50);}
  .row-chevron{color:var(--slate-400);}
  .row-chevron svg{width:15px;height:15px;}

  /* ---------- Pills / Badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;}
  .badge.nuevo{background:#e4f5ea;color:var(--green);}
  .badge.actualizar{background:#fdf1da;color:var(--amber-dark);}
  .badge.sin-cambios{background:var(--slate-100);color:var(--slate-600);}
  .badge.error{background:#fbe6e2;color:var(--red);}
  .badge.atipico{background:#fdf1da;color:var(--amber-dark);}
  .pill-zona{display:inline-block;padding:3px 11px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--kpi-blue-bg);color:var(--kpi-blue-fg);}
  .pill-estado{display:inline-block;padding:3px 11px;border-radius:99px;font-size:11.5px;font-weight:600;}
  .pill-estado.activo{background:#e6f9ed;color:#16a34a;}
  .pill-estado.inactivo{background:var(--slate-100);color:var(--slate-600);}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--radius-sm);
    border:1px solid transparent;font-weight:600;font-size:13px;
  }
  .btn svg{width:14px;height:14px;}
  .btn-primary{background:var(--teal-600);color:#fff;}
  .btn-primary:hover{background:var(--teal-700);}
  .btn-primary:disabled{background:var(--slate-400);cursor:not-allowed;}
  .btn-secondary{background:#fff;color:var(--slate-800);border-color:var(--slate-200);}
  .btn-secondary:hover{background:var(--slate-50);}
  .btn-danger{background:#fff;color:var(--red);border-color:#f0cec7;}
  .btn-danger:hover{background:#fbe6e2;}

  /* ---------- Import zone ---------- */
  .dropzone{
    border:2px dashed var(--slate-200);border-radius:12px;padding:40px 20px;text-align:center;
    color:var(--slate-600);background:var(--slate-50);
  }
  .dropzone.drag{border-color:var(--teal-500);background:var(--teal-50);}
  .dropzone .icon{margin-bottom:10px;color:var(--teal-600);display:flex;justify-content:center;}
  .dropzone .icon svg{width:30px;height:30px;}
  .dropzone input[type=file]{display:none;}

  .summary-strip{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;}
  .summary-pill{border-radius:var(--radius);padding:10px 16px;flex:1;min-width:120px;border:1px solid var(--slate-200);}
  .summary-pill .n{font-family:var(--font-mono);font-size:20px;font-weight:700;}
  .summary-pill .l{font-size:11.5px;color:var(--slate-600);}

  .diff-old{color:var(--slate-400);text-decoration:line-through;font-size:12px;}
  .diff-new{color:var(--navy-950);font-weight:600;}

  /* ---------- Config screen ---------- */
  .config-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy-950);
    padding:20px;
  }
  .config-box{background:#fff;border-radius:14px;padding:32px;width:420px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .config-box h1{font-size:18px;margin:0 0 4px 0;color:var(--navy-950);}
  .config-box p{font-size:12.5px;color:var(--slate-600);margin:0 0 20px 0;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--slate-800);margin-bottom:5px;}
  .field input{width:100%;padding:9px 11px;border:1px solid var(--slate-200);border-radius:var(--radius-sm);}
  .field .hint{font-size:11px;color:var(--slate-400);margin-top:4px;}

  .toast{
    position:fixed;bottom:20px;right:20px;background:var(--navy-950);color:#fff;padding:12px 18px;
    border-radius:var(--radius-sm);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:999;max-width:340px;
  }
  .toast.error{background:var(--red);}
  .toast.success{background:var(--green);}

  .empty{padding:40px 20px;text-align:center;color:var(--slate-400);font-size:13px;}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--slate-200);border-top-color:var(--teal-600);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:998;padding:16px;}
  .modal{background:#fff;border-radius:12px;padding:26px;width:420px;max-width:100%;}
  .modal h3{margin:0 0 8px 0;font-size:15px;}
  .modal p{font-size:13px;color:var(--slate-600);margin:0 0 18px 0;}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}

  .warn-icon{color:var(--amber-dark);}
  .muted{color:var(--slate-400);}
  .section-title{font-size:13px;font-weight:700;color:var(--navy-950);margin:22px 0 10px 0;}
  .search-box{
    position:relative;display:flex;align-items:center;border:1px solid var(--slate-200);border-radius:99px;
    background:#fff;padding:0 12px;height:36px;
  }
  .search-box svg{width:14px;height:14px;color:var(--slate-400);flex:none;}
  .search-box input{border:none;background:transparent;padding:0 0 0 8px;width:190px;color:var(--slate-800);}
  .search-box input:focus{outline:none;}
  .table-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:6px;}

  /* ---------- Instalar app ---------- */
  .install-banner{
    display:none;align-items:center;gap:12px;background:var(--teal-50);border:1px solid #b7ece4;
    border-radius:var(--radius);padding:12px 16px;margin-bottom:18px;
  }
  .install-banner.show{display:flex;}
  .install-banner .ic{width:32px;height:32px;border-radius:9px;background:var(--teal-600);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
  .install-banner .ic svg{width:16px;height:16px;}
  .install-banner .txt{flex:1;font-size:12.5px;color:var(--teal-700);}
  .install-banner .txt strong{display:block;font-size:13px;color:var(--navy-950);}

  /* =========================================================================
     RESPONSIVE — celular
     ========================================================================= */
  @media (max-width: 780px){
    .content{padding:16px 14px 30px 14px;}
    .topbar{padding:14px 16px;position:sticky;top:0;z-index:10;padding-top:calc(14px + env(safe-area-inset-top,0px));}
    .topbar h1{font-size:15px;}
    .tabbar{padding:0 16px;position:sticky;top:57px;z-index:9;}
    .filters{gap:7px;}
    .filter-pill select{min-width:0;width:110px;}
    .kpi-card{padding:12px 13px;flex-basis:130px;min-width:130px;}
    .kpi-card .value{font-size:17px;}
    .search-box input{width:120px;}
    .config-box{padding:26px;}
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   MÓDULO GPS — App independiente
   Vistas: Resumen GPS · Vehículos · Histórico · Importar Reporte
   ========================================================================= */

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_CAP = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ZONAS_CONOCIDAS_KEY = 'gps_zonas_conocidas';
const CFG_KEY = 'gps_supabase_config';

/* ---------------------------------------------------------------------
   Íconos (SVG inline, estilo lucide) — un solo set reutilizado en toda la app
   --------------------------------------------------------------------- */
const ICN = {
  pin: '<path d="M12 21s-7-6.1-7-11a7 7 0 1 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  truck: '<rect x="1" y="7" width="14" height="10" rx="1.5"/><path d="M15 10h4l3 3.2V17h-7z"/><circle cx="6" cy="19" r="1.6"/><circle cx="17.5" cy="19" r="1.6"/>',
  chart: '<path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M22 19H2"/>',
  upload: '<path d="M12 15V4"/><path d="M7 9l5-5 5 5"/><rect x="3" y="16" width="18" height="5" rx="1.5"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  car: '<path d="M4 16V9.5l2-4h12l2 4V16"/><path d="M2 16h20v2H2z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>',
  tag: '<path d="M3 11.2 12.5 2h6.3a2 2 0 0 1 2 2v6.3L12 20 3 11.2z"/><circle cx="15" cy="6.5" r="1.4"/>',
  mapPin: '<path d="M12 21s-6.5-5.8-6.5-10.2a6.5 6.5 0 1 1 13 0C18.5 15.2 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.2"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.6 6"/><path d="M20 4v7h-7"/>',
  dots: '<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
  search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.3-4.3"/>',
  download: '<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/>',
  droplet: '<path d="M12 3s6 6.8 6 11a6 6 0 1 1-12 0c0-4.2 6-11 6-11z"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  gauge: '<path d="M4.5 16a8 8 0 1 1 15 0"/><path d="M12 12l3-2.4"/><path d="M4.5 16h1.2M18.3 16h1.2"/>',
  fuel: '<path d="M5 20V6a1.5 1.5 0 0 1 1.5-1.5H12A1.5 1.5 0 0 1 13.5 6v14"/><path d="M4 20h11"/><path d="M13.5 9h2l2.7 2.7v5.3a1.3 1.3 0 0 1-2.6 0V15"/>',
  chevronRight: '<path d="M9 6l6 6-6 6"/>',
  trendUp: '<path d="M4 15l6-6 4 4 6-7"/><path d="M15 6h5v5"/>',
  trendDown: '<path d="M4 9l6 6 4-4 6 7"/><path d="M15 18h5v-5"/>',
  sort: '<path d="M8 9l4-5 4 5"/><path d="M16 15l-4 5-4-5"/>',
  install: '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/>',
  close: '<path d="M6 6l12 12"/><path d="M18 6L6 18"/>',
  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  fix: '<circle cx="12" cy="12" r="9"/><path d="M8 12l2.5 2.5L16 9"/>',
};
function icon(name, cls){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls||''}">${ICN[name]||''}</svg>`;
}
const KPI_TINTS = { blue:'kpi-blue', green:'kpi-green', teal:'kpi-teal', amber:'kpi-amber', violet:'kpi-violet', rose:'kpi-rose' };

/* =========================================================================
   ⚙️  CONFIGURACIÓN DE SUPABASE — reemplazar acá los dos valores
   Project Settings → API → Project URL / anon public key
   ========================================================================= */
const DEFAULT_SUPABASE_URL = 'https://oixzkvkybqexvrzwzwis.supabase.co';
const DEFAULT_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9peHprdmt5YnFleHZyend6d2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTUxNzEsImV4cCI6MjEwNDQzMTE3MX0.BTghtY8mZkyrK2y-kZXMb1aIecptX3OHOpNFqUBMzP4';
/* ========================================================================= */

let state = {
  view: 'resumen',
  sb: null,
  filters: { periodo:'', vehiculo:'', modelo:'', zona:'' },
  importState: null, // { file, parsedRows, periodo, periodoLabel, hash, preview, importing }
};

/* ---------------------------------------------------------------------
   Config (URL + anon key) — se guarda en localStorage del navegador
   --------------------------------------------------------------------- */
function getConfig(){
  try{
    const saved = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
    if(saved && saved.url && saved.anonKey) return saved;
  }catch(e){}

  }
  return null;
}

   Utilidades de formato

/* =========================================================================
   PARSEO DE EXCEL — tolerante a formato: matchea por ENCABEZADO (no por
   posición de columna ni nombre de hoja), y detecta el tipo real de cada
   celda (texto con unidad, número crudo, o duración de Excel).
   ========================================================================= */

// alias de encabezados aceptados por campo (todo en minúsculas, sin tildes)
const HEADER_ALIASES = {
  dispositivo:      ['dispositivo','vehiculo','patente','dominio','movil','unidad'],
  fecha_inicio:     ['fecha de inicio','fecha inicio','fecha'],
  horas_motor:      ['horas motor','horas de motor','hs motor','horas encendido'],
  horas_ralenti:    ['horas en ralenti','horas ralenti','horas de ralenti','hs ralenti','ralenti'],
  distancia_km:     ['distancia','distancia km','distancia recorrida','kilometros','km recorridos'],
  velocidad_maxima: ['velocidad maxima','velocidad max','vel maxima','vel. maxima','velocidad'],
  litros_ypf:       ['litros ypf','litros','combustible litros','combustible'],
};
// zonas conocidas de fábrica (se amplía sola al detectar nuevas al cargar vehículos)
const ZONAS_DEFAULT = ['REDES','SALTA','MENDOZA','SAN LUIS','SAN JUAN','CORDOBA','ENTRE RIOS','SGO DEL ESTERO','NEA NORTE','NOA CENTRO'];

function normalizarTexto(s){
  return String(s||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // saca tildes
    .trim().replace(/\s+/g,' ');
}

function matchHeaderField(headerText){
  const h = normalizarTexto(headerText);
  if(!h) return null;
  for(const [field, aliases] of Object.entries(HEADER_ALIASES)){
    if(aliases.some(a => h === a || h.includes(a))) return field;
  }
  return null;
}

// localiza la fila de encabezados y arma el mapa {campo: índice de columna}
// escaneando las primeras filas de la hoja — no asume una posición fija.
function detectarEncabezados(rows){
  let mejor = { idx:-1, mapa:{}, matches:0 };
  const limite = Math.min(rows.length, 25);
  for(let i=0;i<limite;i++){
    const fila = rows[i] || [];
    const mapa = {};
    fila.forEach((celda, col) => {
      const campo = matchHeaderField(celda);
      if(campo && mapa[campo]===undefined) mapa[campo] = col;
    });
    const matches = Object.keys(mapa).length;
    if(matches > mejor.matches && mapa.dispositivo !== undefined){
      mejor = { idx:i, mapa, matches };
    }
  }
  return mejor.matches >= 2 ? mejor : null; // dispositivo + al menos 1 campo más
}

// Detecta patentes partidas en 2 o 3 bloques por espacios y las une en un
// solo token, para que nunca quede un dominio incompleto.
//   Vieja  (pre-2016): LLL NNN        -> LLLNNN     ej "PKS 223"   -> "PKS223"
//   Nueva  (2016+):    LL NNN LL      -> LLNNNLL    ej "AC 858 HC" -> "AC858HC"
//                      LLNNN LL       -> LLNNNLL    ej "AC858 HC"  -> "AC858HC"
//                      LL NNNLL       -> LLNNNLL    ej "AC 858HC"  -> "AC858HC"
function juntarPatentePartida(parts){
  const out = [];
  let i = 0;
  while(i < parts.length){
    const a = parts[i], b = parts[i+1], c = parts[i+2];
    // nueva en 3 bloques: LL + NNN + LL
    if(a && b && c && /^[A-Z]{2}$/i.test(a) && /^\d{3}$/.test(b) && /^[A-Z]{2}$/i.test(c)){
      out.push(a+b+c); i += 3; continue;
    }
    // nueva en 2 bloques: LLNNN + LL   ó   LL + NNNLL
    if(a && b && (
        (/^[A-Z]{2}\d{3}$/i.test(a) && /^[A-Z]{2}$/i.test(b)) ||
        (/^[A-Z]{2}$/i.test(a) && /^\d{3}[A-Z]{2}$/i.test(b))
      )){
      out.push(a+b); i += 2; continue;
    }
    // vieja en 2 bloques: LLL + NNN
    if(a && b && /^[A-Z]{3}$/i.test(a) && /^\d{3}$/.test(b)){
      out.push(a+b); i += 2; continue;
    }
    out.push(a); i += 1;
  }
  return out;
}

function parseDispositivo(raw){
  const txt = normalizarTextoConservandoMayus(raw);
  let parts = txt.split(' ').filter(Boolean);
  if(!parts.length) return { patente:null, modelo:null, zona:null };

  const RE_MERCOSUR = /^[A-Z]{2}\d{3}[A-Z]{2}$/;   // patente 2016+, ej AC858HC
  const RE_VIEJA    = /^[A-Z]{3}\d{3}$/;            // patente pre-2016, ej PKS223

  // El archivo a veces trae la patente vieja partida por un espacio
  // ("PKS 223" en vez de "PKS223"), o la 2016+ partida en sus 3 bloques
  // ("AC 858 HC"). Se unen ANTES de buscar cuál token es la patente, para
  // nunca quedarnos con el dominio incompleto (ej. solo "PKS").
  parts = juntarPatentePartida(parts);

  let patenteIdx = parts.findIndex(p => RE_MERCOSUR.test(p) || RE_VIEJA.test(p));
  if(patenteIdx === -1) patenteIdx = 0; // fallback: primer token, como antes

  const patente = parts[patenteIdx].toUpperCase();
  const resto = parts.filter((_,i)=>i!==patenteIdx);

  const zonas = getZonasConocidas();
  let zona = null, modelo = resto.join(' ');
  // probar match de zona de 3, 2 y 1 palabra (de más larga a más corta)
  for(const n of [3,2,1]){
    if(zona || resto.length < n) continue;
    const ult = resto.slice(-n).join(' ').toUpperCase();
    if(zonas.includes(ult)){ zona = ult; modelo = resto.slice(0,-n).join(' '); }
  }
  return { patente, modelo: modelo || null, zona };
}
function normalizarTextoConservandoMayus(raw){
  return String(raw||'').trim().replace(/\s+/g,' ');
}

// Distancia: puede venir como número crudo (ya en km) o como texto "2501 Km" / "364 m"
function parseDistancia(raw){
  if(raw===null || raw===undefined || raw==='') return null;
  if(typeof raw === 'number') return round(raw, 3);
  const s = String(raw).trim().replace(',', '.');
  const m = s.match(/([\d.]+)\s*(km|m)\b/i);
  if(m){
    const val = parseFloat(m[1]);
    if(isNaN(val)) return null;
    return m[2].toLowerCase()==='km' ? round(val,3) : round(val/1000,3);
  }
  const asNum = parseFloat(s);
  return isNaN(asNum) ? null : round(asNum,3);
}

// Horas (motor / ralentí): puede venir como texto "91 h 16 min", como número
// puro de horas, o como duración cruda de Excel (fracción de día, ej 6.035).
function parseHoras(raw){
  if(raw===null || raw===undefined || raw==='') return null;
  if(typeof raw === 'number'){
    // Heurística: una duración de Excel para "horas en un mes" no debería
    // superar ~31*24=744hs. Si el número ya viene expresado en horas
    // (>50) lo tomamos tal cual; si es una fracción de día (<50) lo
    // multiplicamos por 24. Esto cubre archivos que exportan ya en horas
    // y archivos que exportan la celda de duración cruda de Excel.
    return raw < 50 ? round(raw*24, 2) : round(raw, 2);
  }
  const s = String(raw).trim();
  if(s==='') return null;
  const m = s.match(/(\d+)\s*h\s*(\d+)?\s*min?/i);
  if(m){
    const h = parseInt(m[1],10) || 0;
    const min = parseInt(m[2]||'0',10) || 0;
    return round(h + min/60, 2);
  }
  const asNum = parseFloat(s.replace(',','.'));
  return isNaN(asNum) ? null : round(asNum,2);
}

function parseVelocidad(raw){
  if(raw===null || raw===undefined || raw==='') return null;
  if(typeof raw === 'number') return round(raw,1);
  const m = String(raw).match(/([\d.,]+)/);
  if(!m) return null;
  return round(parseFloat(m[1].replace(',','.')), 1);
}

function parseLitros(raw){
  if(raw===null || raw===undefined || raw==='') return null;
  const n = typeof raw === 'number' ? raw : parseFloat(String(raw).replace(',','.'));
  return isNaN(n) ? null : round(n,2);
}

const EXCEL_EPOCH_MS = Date.UTC(1899,11,30);
function excelSerialToISO(serial){
  const ms = EXCEL_EPOCH_MS + Math.round(serial) * 86400000;
  return new Date(ms).toISOString().slice(0,10);
}
function parseFechaInicio(raw){
  if(raw===null || raw===undefined || raw==='') return null;
  if(raw instanceof Date) return raw.toISOString().slice(0,10);
  if(typeof raw === 'number') return excelSerialToISO(raw);
  const s = String(raw).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m){
    const [_, d, mo, y] = m;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  return null;
}
function periodoDeFecha(fechaISO){
  if(!fechaISO) return null;
  const key = fechaISO.slice(0,7); // 'YYYY-MM'
  return { periodo:key, label: periodoLabelFromKey(key) };
}

function round(n, dec){
  const f = Math.pow(10,dec);
  return Math.round(n*f)/f;
}

// Período GLOBAL del archivo (metadata o nombre de archivo). Si no se
// encuentra, cada fila usa su propio período derivado de "Fecha de inicio"
// (ver periodoDeFecha) — esto es lo que permite importar reportes
// consolidados que abarcan varios meses en un solo Excel.
function detectarPeriodoGlobal(rows, fileName){
  for(const r of rows){
    const c0 = String(r[0]||'').toLowerCase();
    if(c0.includes('período') || c0.includes('periodo')){
      const val = String(r[1]||'');
      const m = val.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if(m){
        const mes = m[2].padStart(2,'0');
        const anio = m[3];
        return { periodo: `${anio}-${mes}`, label: periodoLabelFromKey(`${anio}-${mes}`) };
      }
    }
  }
  const lower = (fileName||'').toLowerCase();
  for(let i=0;i<MESES.length;i++){
    if(lower.includes(MESES[i])){
      const y = lower.match(/(20\d{2})/);
      if(y){
        const mm = String(i+1).padStart(2,'0');
        return { periodo: `${y[1]}-${mm}`, label: periodoLabelFromKey(`${y[1]}-${mm}`) };
      }
    }
  }
  return { periodo: null, label: null };
}

async function hashFile(file){
  const buf = await file.arrayBuffer();
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function parseExcel(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array' }); // sin cellDates: dejamos que cada
                                                // parser interprete el tipo crudo
  // no asumimos el nombre de la hoja — probamos todas hasta encontrar encabezados válidos
  let encontrado = null, sheetName = null, rows = null;
  for(const name of wb.SheetNames){
    const ws = wb.Sheets[name];
    const r = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null });
    const enc = detectarEncabezados(r);
    if(enc){ encontrado = enc; sheetName = name; rows = r; break; }
  }
  if(!encontrado){
    return { periodo:null, periodoLabel:null, rows:[], errores:[], totalFilas:0, sheetName:null,
      errorGeneral:'No se pudieron identificar las columnas esperadas (Dispositivo, Fecha de inicio, Horas motor, Horas en ralentí, Distancia, Velocidad máxima, Litros YPF) en ninguna hoja del archivo.' };
  }

  const { idx: headerIdx, mapa } = encontrado;
  const globalPeriodo = detectarPeriodoGlobal(rows, file.name);

  const dataRows = rows.slice(headerIdx+1).filter(r => r && mapa.dispositivo!==undefined && r[mapa.dispositivo] && String(r[mapa.dispositivo]).trim()!=='');

  const parsed = [];
  const errores = [];
  const vistosEnArchivo = new Set();
  const periodosDetectados = new Set();

  dataRows.forEach((r, i) => {
    const dispositivoRaw = r[mapa.dispositivo];
    const { patente, modelo, zona } = parseDispositivo(dispositivoRaw);
    if(!patente){
      errores.push({ fila: headerIdx+2+i, motivo:'No se pudo identificar el dispositivo/dominio', raw: dispositivoRaw });
      return;
    }
    if(!/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(patente) && !/^[A-Z]{3}\d{3}$/.test(patente)){
      errores.push({ fila: headerIdx+2+i, motivo:`Dominio "${patente}" no coincide con ningún formato de patente válido (vieja: LLLNNN ej. PKS223, o 2016+: LLNNNLL ej. AC858HC)`, raw: dispositivoRaw });
      return;
    }
    const fecha_inicio = mapa.fecha_inicio!==undefined ? parseFechaInicio(r[mapa.fecha_inicio]) : null;

    let periodo, periodoLabel;
    if(globalPeriodo.periodo){
      periodo = globalPeriodo.periodo; periodoLabel = globalPeriodo.label;
    }else{
      const pf = periodoDeFecha(fecha_inicio);
      if(!pf){
        errores.push({ fila: headerIdx+2+i, motivo:'No se pudo determinar el período (sin metadata de período y sin fecha de inicio válida)', raw: dispositivoRaw });
        return;
      }
      periodo = pf.periodo; periodoLabel = pf.label;
    }
    periodosDetectados.add(periodo);

    const claveDup = patente+'|'+periodo;
    const row = {
      patente, modelo, zona, periodo, periodoLabel,
      fecha_inicio,
      horas_motor: mapa.horas_motor!==undefined ? parseHoras(r[mapa.horas_motor]) : null,
      horas_ralenti: mapa.horas_ralenti!==undefined ? parseHoras(r[mapa.horas_ralenti]) : null,
      distancia_km: mapa.distancia_km!==undefined ? parseDistancia(r[mapa.distancia_km]) : null,
      velocidad_maxima: mapa.velocidad_maxima!==undefined ? parseVelocidad(r[mapa.velocidad_maxima]) : null,
      litros_ypf: mapa.litros_ypf!==undefined ? parseLitros(r[mapa.litros_ypf]) : null,
      _dup_en_archivo: vistosEnArchivo.has(claveDup),
    };
    vistosEnArchivo.add(claveDup);
    parsed.push(row);
  });

  const periodosOrdenados = [...periodosDetectados].sort();
  const periodoResumen = periodosOrdenados.length<=1
    ? (periodosOrdenados[0] ? periodoLabelFromKey(periodosOrdenados[0]) : null)
    : `${periodosOrdenados.length} períodos (${periodoLabelFromKey(periodosOrdenados[0])} – ${periodoLabelFromKey(periodosOrdenados[periodosOrdenados.length-1])})`;

  return {
    periodo: periodosOrdenados.length===1 ? periodosOrdenados[0] : null,
    periodoLabel: periodoResumen,
    periodos: periodosOrdenados,
    rows: parsed, errores, totalFilas: dataRows.length, sheetName,
  };
}

/* =========================================================================
   DATOS — capa Supabase
   ========================================================================= */
async function sbSelect(table, cols, filters){
  let q = state.sb.from(table).select(cols || '*');
  if(filters){
    for(const [k,v] of Object.entries(filters)){
      if(v!==undefined && v!==null && v!=='') q = q.eq(k, v);
    }
  }
  const { data, error } = await q;
  if(error) throw error;
  return data;
}

async function fetchFilterOptions(){
  const [reportes, vehiculos] = await Promise.all([
    sbSelect('gps_reportes', 'periodo, periodo_label, zona_periodo, modelo_periodo'),
    sbSelect('vehiculos', 'dominio, region, label'),
  ]);
  const periodos = uniqBy(reportes, 'periodo').sort((a,b)=>b.periodo.localeCompare(a.periodo));
  // unión de lo que hay en vehiculos (zona/modelo actuales) + lo que aparece
  // históricamente en los reportes (por si un vehículo cambió de zona)
  const modelos = [...new Set([...vehiculos.map(v=>v.label), ...reportes.map(r=>r.modelo_periodo)].filter(Boolean))].sort();
  const zonas = [...new Set([...vehiculos.map(v=>v.region), ...reportes.map(r=>r.zona_periodo)].filter(Boolean))].sort();
  return { periodos, vehiculos, modelos, zonas };
}
function uniqBy(arr, key){
  const seen = new Set(); const out = [];
  for(const it of arr){ if(!seen.has(it[key])){ seen.add(it[key]); out.push(it); } }
  return out;
}

async function fetchReportesFiltrados(filters){
  let q = state.sb.from('gps_reportes').select('*, vehiculos(dominio, region, label)');
  if(filters.periodo) q = q.eq('periodo', filters.periodo);
  const { data, error } = await q;
  if(error) throw error;
  let rows = data || [];
  if(filters.vehiculo) rows = rows.filter(r => r.vehiculo_dominio === filters.vehiculo);
  // se usa el dato histórico del reporte (zona/modelo "de ese momento") y,
  // si el reporte es viejo y no lo tiene guardado, se cae al dato actual del vehículo
  if(filters.modelo) rows = rows.filter(r => (r.modelo_periodo || (r.vehiculos&&r.vehiculos.label)) === filters.modelo);
  if(filters.zona) rows = rows.filter(r => (r.zona_periodo || (r.vehiculos&&r.vehiculos.region)) === filters.zona);
  return rows;
}

function agregarKPIs(rows){
  const kmTotal = sumField(rows, 'distancia_km');
  const litrosTotal = sumField(rows, 'litros_ypf');
  const horasMotor = sumField(rows, 'horas_motor');
  const horasRalenti = sumField(rows, 'horas_ralenti');
  const velMax = rows.reduce((m,r)=> r.velocidad_maxima!==null && r.velocidad_maxima>m ? r.velocidad_maxima : m, 0);
  const kml = litrosTotal ? kmTotal/litrosTotal : null;
  const l100 = kmTotal ? litrosTotal/(kmTotal/100) : null;
  const vehiculosCount = new Set(rows.map(r=>r.vehiculo_dominio)).size;
  return { kmTotal, litrosTotal, horasMotor, horasRalenti, velMax, kml, l100, vehiculosCount };
}
function sumField(rows, f){
  return rows.reduce((s,r)=> s + (r[f]!==null && r[f]!==undefined ? Number(r[f]) : 0), 0);
}

function kpiCard({label, dec, unit, iconName, tint, curr, prev, staticCaption, invert}){
  let trendHtml = '', caption = staticCaption || '';
  if(prev!==undefined && prev!==null && curr!==undefined && curr!==null){
    const diff = curr - prev;
    const pct = prev !== 0 ? (diff/Math.abs(prev))*100 : null;
    let good = diff >= 0;
    if(invert) good = !good;
    const dirIcon = diff >= 0 ? 'trendUp' : 'trendDown';
    const pctTxt = pct!==null ? `${pct>=0?'+':''}${fmtNum(pct,0)}%` : `${diff>=0?'+':''}${fmtNum(diff,dec)}`;
    trendHtml = `<span class="kpi-trend ${good?'up':'down'}">${icon(dirIcon)}${pctTxt}</span>`;
    caption = `${fmtNum(prev,dec)}${unit?' '+esc(unit):''} mes anterior`;
  }
  const value = curr!==undefined && curr!==null ? fmtNum(curr,dec) : '—';
  return `<div class="kpi-card tint">
    <div class="kpi-top">
      <span class="kpi-icon" style="background:var(--kpi-${tint}-bg);color:var(--kpi-${tint}-fg)">${icon(iconName)}</span>
      ${trendHtml}
    </div>
    <div class="label">${esc(label)}</div>
    <div class="value">${value}${unit?`<span class="unit">${esc(unit)}</span>`:''}</div>
    ${caption?`<div class="caption">${esc(caption)}</div>`:''}
  </div>`;
}

function exportarCSV(rows){
  const headers = ['Dispositivo','Zona','Periodo','Km','Litros','Km_L','HsMotor','HsRalenti','VelMax'];
  const lines = [headers.join(';')];
  rows.forEach(r=>{
    const kml = (r.litros_ypf && r.distancia_km) ? (r.distancia_km/r.litros_ypf).toFixed(2) : '';
    lines.push([
      nombreCompleto(r.vehiculos?.dominio, r.modelo_periodo||r.vehiculos?.label), r.zona_periodo||r.vehiculos?.region||'',
      r.periodo_label||'', r.distancia_km??'', r.litros_ypf??'', kml, r.horas_motor??'', r.horas_ralenti??'', r.velocidad_maxima??''
    ].map(v=>String(v).replace(/;/g,',')).join(';'));
  });
  const csv = '\uFEFF' + lines.join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `gps_detalle_${state.filters.periodo||'todos'}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// Re-separa zona/modelo en registros ya guardados, usando la lista de zonas
// conocida ACTUAL (útil cuando se importó antes de que alguna zona nueva
// estuviera reconocida, y quedó pegada dentro del modelo). No toca el
// dominio ni crea/borra vehículos — solo redistribuye texto entre
// label/region (vehiculos) y modelo_periodo/zona_periodo (gps_reportes).
function reseparzarZona(texto){
  if(!texto) return null;
  const partes = String(texto).trim().split(/\s+/);
  const zonas = getZonasConocidas();
  for(const n of [3,2,1]){
    if(partes.length < n) continue;
    const ult = partes.slice(-n).join(' ').toUpperCase();
    if(zonas.includes(ult)) return { modelo: partes.slice(0,-n).join(' ') || null, zona: ult };
  }
  return null;
}
async function corregirNombresExistentes(){
  const proceed = await confirmModal(
    'Corregir nombres existentes',
    'Va a revisar todos los vehículos y reportes ya guardados, y separar la zona del modelo en los que quedaron pegados (usando las zonas conocidas hasta ahora: ' + getZonasConocidas().join(', ') + '). No borra ni crea vehículos, solo reordena texto.',
    'Corregir'
  );
  if(!proceed) return;

  let corregidosVehiculos = 0, corregidosReportes = 0;
  const vehiculos = await sbSelect('vehiculos','*');
  for(const v of vehiculos){
    const r = reseparzarZona(v.label);
    if(r && (r.zona !== v.region || r.modelo !== v.label)){
      await state.sb.from('vehiculos').update({ label: r.modelo, region: r.zona }).eq('dominio', v.dominio);
      corregidosVehiculos++;
    }
  }
  const reportes = await sbSelect('gps_reportes','id, modelo_periodo, zona_periodo');
  for(const rep of reportes){
    const r = reseparzarZona(rep.modelo_periodo);
    if(r && (r.zona !== rep.zona_periodo || r.modelo !== rep.modelo_periodo)){
      await state.sb.from('gps_reportes').update({ modelo_periodo: r.modelo, zona_periodo: r.zona }).eq('id', rep.id);
      corregidosReportes++;
    }
  }
  toast(`Corregidos: ${corregidosVehiculos} vehículos, ${corregidosReportes} reportes.`, 'success');
  renderView();
}

    <div id="import-result"></div>
    <div class="section-title">Cargas anteriores</div>
    <div class="table-wrap" id="historial-cargas"><div class="empty"><span class="spin"></span></div></div>
  </div>`;
  document.body.appendChild(bg);
  document.getElementById('import-modal-close').onclick = () => bg.remove();
  bg.addEventListener('click', (e) => { if(e.target === bg) bg.remove(); });

  const dz = document.getElementById('dz');
  const fileInput = document.getElementById('file-input');
  dz.onclick = () => fileInput.click();
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev, e=>{e.preventDefault(); dz.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev, e=>{e.preventDefault(); dz.classList.remove('drag');}));
  dz.addEventListener('drop', e=>{ if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  fileInput.onchange = e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); };

  loadHistorialCargas();
}

async function loadHistorialCargas(){
  const el = document.getElementById('historial-cargas');
  if(!el) return;
  try{
    const { data, error } = await state.sb.from('gps_importaciones').select('*').order('fecha_carga', { ascending:false }).limit(20);
    if(error) throw error;
    if(!data.length){ el.innerHTML = '<div class="empty">Todavía no se procesó ningún archivo.</div>'; return; }
    el.innerHTML = `<table>
      <thead><tr><th>Fecha</th><th>Archivo</th><th>Período</th><th class="num">Nuevos</th><th class="num">Actualizados</th><th class="num">Sin cambios</th><th class="num">Errores</th><th>Estado</th></tr></thead>
      <tbody>${data.map(i=>`<tr>
        <td>${new Date(i.fecha_carga).toLocaleString('es-AR')}</td>
        <td>${esc(i.nombre_archivo)}</td>
        <td>${esc(i.periodo_label)}</td>
        <td class="num">${i.registros_nuevos}</td>
        <td class="num">${i.registros_actualizados}</td>
        <td class="num">${i.registros_sin_cambios}</td>
        <td class="num">${i.registros_error}</td>
        <td>${i.estado}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  }catch(e){
    el.innerHTML = `<div class="empty">No se pudo cargar el historial (${esc(e.message||e)}).</div>`;
  }
}

async function handleFile(file){
  const resultEl = document.getElementById('import-result');
  resultEl.innerHTML = `<div class="empty"><span class="spin"></span> Analizando archivo…</div>`;
  try{
    const hash = await hashFile(file);
    const { data: yaExiste } = await state.sb.from('gps_importaciones').select('id, nombre_archivo, fecha_carga').eq('hash_archivo', hash).limit(1);
    const parsed = await parseExcel(file);

    if(parsed.errorGeneral){
      resultEl.innerHTML = `<div class="panel"><div class="panel-body"><strong style="color:var(--red)">${esc(parsed.errorGeneral)}</strong></div></div>`;
      return;
    }
    if(!parsed.rows.length && !parsed.errores.length){
      resultEl.innerHTML = `<div class="panel"><div class="panel-body"><strong style="color:var(--red)">No se encontraron filas de datos debajo del encabezado.</strong></div></div>`;
      return;
    }

    if(yaExiste && yaExiste.length){
      const proceed = await confirmModal(
        'Este archivo ya fue procesado anteriormente',
        `Se cargó el ${new Date(yaExiste[0].fecha_carga).toLocaleString('es-AR')} como "${yaExiste[0].nombre_archivo}". Podés cancelar, o continuar igual si sabés que el contenido cambió.`,
        'Continuar igual'
      );
      if(!proceed){ resultEl.innerHTML=''; return; }
    }

    await buildPreview(file, hash, parsed, resultEl);
  }catch(e){
    console.error(e);
    resultEl.innerHTML = `<div class="panel"><div class="panel-body"><strong style="color:var(--red)">Error al leer el archivo.</strong><p class="muted">${esc(e.message||e)}</p></div></div>`;
  }
}

async function buildPreview(file, hash, parsed, resultEl){
  resultEl.innerHTML = `<div class="empty"><span class="spin"></span> Comparando con Supabase…</div>`;

  // vehículos existentes (para resolver patente -> dominio, o detectar que hay que crearlo)
  const vehiculosExistentes = await sbSelect('vehiculos', '*');
  const porPatente = {}; vehiculosExistentes.forEach(v=>porPatente[v.dominio]=v);

  // reportes existentes — para TODOS los períodos que aparecen en este archivo
  // (un mismo Excel puede traer varios meses consolidados)
  let reportesExistentes = [];
  if(parsed.periodos.length){
    const { data, error } = await state.sb.from('gps_reportes').select('*').in('periodo', parsed.periodos);
    if(error) throw error;
    reportesExistentes = data;
  }
  const reportePorClave = {}; reportesExistentes.forEach(r=>reportePorClave[r.vehiculo_dominio+'|'+r.periodo]=r);

  const camposComparar = ['fecha_inicio','horas_motor','horas_ralenti','distancia_km','velocidad_maxima','litros_ypf','zona_periodo','modelo_periodo'];
  const distancias = parsed.rows.map(r=>r.distancia_km).filter(v=>v!==null);
  const mediana = medianOf(distancias);

  const preview = parsed.rows.map(row => {
    if(row._dup_en_archivo){
      return { ...row, estado:'error', motivo:'Mismo dispositivo + mismo período repetido dentro del archivo' };
    }
    const esAtipico = row.distancia_km!==null && mediana>0 && row.distancia_km > mediana*5;
    const vehiculoExistente = porPatente[row.patente];
    const claveReporte = row.patente+'|'+row.periodo;
    const reporteExistente = reportePorClave[claveReporte];
    if(!vehiculoExistente || !reporteExistente){
      return { ...row, estado:'nuevo', esAtipico, diffs:null };
    }
    const nuevoValores = { ...row, zona_periodo: row.zona, modelo_periodo: row.modelo };
    const diffs = {};
    let cambio = false;
    camposComparar.forEach(c=>{
      const antes = reporteExistente[c];
      const despues = nuevoValores[c];
      const a = antes===undefined?null:antes;
      const d = despues===undefined?null:despues;
      if(String(a) !== String(d)){ cambio = true; diffs[c] = { antes:a, despues:d }; }
    });
    return cambio
      ? { ...row, estado:'actualizar', esAtipico, diffs, reporteId: reporteExistente.id, vehiculoId: vehiculoExistente.dominio }
      : { ...row, estado:'sin-cambios', esAtipico, diffs:null, reporteId: reporteExistente.id, vehiculoId: vehiculoExistente.dominio };
  });

  parsed.errores.forEach(e => preview.push({ patente:'—', periodoLabel:'—', estado:'error', motivo: e.motivo + (e.raw? ` ("${e.raw}")`:'') }));

  state.importState = { file, hash, parsed, preview };
  renderPreview(resultEl);
}

function medianOf(arr){
  if(!arr.length) return 0;
  const s = [...arr].sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
}

function renderPreview(resultEl){
  const { parsed, preview } = state.importState;
  const counts = { nuevo:0, actualizar:0, 'sin-cambios':0, error:0 };
  preview.forEach(p=>counts[p.estado]++);
  const multiPeriodo = parsed.periodos.length > 1;

  resultEl.innerHTML = `
    <div class="panel">
      <div class="panel-head"><div class="panel-head-left"><span class="ic">${icon('search')}</span><h2>Reporte detectado</h2></div></div>
      <div class="panel-body">
        <p><strong>Archivo:</strong> ${esc(state.importState.file.name)} &nbsp; · &nbsp; <strong>Período${multiPeriodo?'s':''}:</strong> ${esc(parsed.periodoLabel)} &nbsp; · &nbsp; <strong>Registros:</strong> ${parsed.totalFilas}</p>
        <div class="summary-strip">
          <div class="summary-pill" style="border-color:#cdeedb"><div class="n" style="color:var(--green)">${counts.nuevo}</div><div class="l">🟢 Nuevos</div></div>
          <div class="summary-pill" style="border-color:#f6e2b8"><div class="n" style="color:var(--amber-dark)">${counts.actualizar}</div><div class="l">🟡 Actualizar</div></div>
          <div class="summary-pill"><div class="n" style="color:var(--slate-600)">${counts['sin-cambios']}</div><div class="l">⚪ Sin cambios</div></div>
          <div class="summary-pill" style="border-color:#f3cec5"><div class="n" style="color:var(--red)">${counts.error}</div><div class="l">🔴 Errores</div></div>
        </div>
        <div class="table-wrap" style="max-height:420px;overflow-y:auto">
          <table>
            <thead><tr><th>Vehículo</th>${multiPeriodo?'<th>Período</th>':''}<th>Estado</th><th>Detalle</th></tr></thead>
            <tbody>
              ${preview.map(p=>`<tr>
                <td>${esc(p.patente)}${p.esAtipico?' <span class="badge atipico">⚠ atípico</span>':''}</td>
                ${multiPeriodo?`<td>${esc(p.periodoLabel||'—')}</td>`:''}
                <td>${badgeEstado(p.estado)}</td>
                <td>${detalleFila(p)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div style="display:flex;gap:10px;margin-top:18px">
          <button class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
          <button class="btn btn-primary" id="btn-confirmar" ${counts.nuevo+counts.actualizar===0?'disabled':''}>Confirmar importación</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('btn-cancelar').onclick = () => { state.importState=null; resultEl.innerHTML=''; };
  document.getElementById('btn-confirmar').onclick = () => ejecutarImportacion(resultEl);
}
function badgeEstado(estado){
  const map = { nuevo:['nuevo','Nuevo'], actualizar:['actualizar','Actualizar'], 'sin-cambios':['sin-cambios','Sin cambios'], error:['error','Error'] };
  const [cls,label] = map[estado] || ['','—'];
  return `<span class="badge ${cls}">${label}</span>`;
}
const NOMBRE_CAMPO = { zona_periodo:'zona', modelo_periodo:'modelo', fecha_inicio:'fecha inicio', horas_motor:'hs motor', horas_ralenti:'hs ralentí', distancia_km:'km', velocidad_maxima:'vel. máx', litros_ypf:'litros' };
function detalleFila(p){
  if(p.estado==='error') return `<span class="muted">${esc(p.motivo||'')}</span>`;
  if(p.estado==='nuevo') return `<span class="diff-new">Km: ${fmtNum(p.distancia_km,0)} · Litros: ${fmtNum(p.litros_ypf,1)}${p.zona?' · Zona: '+esc(p.zona):''}</span>`;
  if(p.estado==='sin-cambios') return `<span class="muted">—</span>`;
  if(p.estado==='actualizar' && p.diffs){
    return Object.entries(p.diffs).map(([campo,v])=>
      `<span class="diff-old">${esc(String(v.antes ?? '—'))}</span> → <span class="diff-new">${esc(String(v.despues ?? '—'))}</span> <span class="muted">(${esc(NOMBRE_CAMPO[campo]||campo)})</span>`
    ).join('<br>');
  }
  return '';
}

async function ejecutarImportacion(resultEl){
  const btn = document.getElementById('btn-confirmar');
  btn.disabled = true; btn.textContent = 'Importando…';
  const { parsed, preview, hash, file } = state.importState;

  try{
    let nuevos=0, actualizados=0, sinCambios=0, errores=0;
    const vehiculosTocados = new Set();

    // 0. crear la importación primero, para poder linkear cada reporte a medida que se procesa
    const { data: importacion, error: errImpIni } = await state.sb.from('gps_importaciones').insert({
      nombre_archivo: file.name,
      periodo: parsed.periodos.length===1 ? parsed.periodos[0] : 'multiple',
      periodo_label: parsed.periodoLabel,
      hash_archivo: hash,
      total_registros: parsed.totalFilas,
      registros_nuevos: 0, registros_actualizados: 0, registros_sin_cambios: 0, registros_error: 0,
      estado: 'procesando',
    }).select('id').single();
    if(errImpIni) throw errImpIni;

    for(const row of preview){
      if(row.estado==='error'){ errores++; continue; }
      if(row.estado==='sin-cambios'){ sinCambios++; continue; }

      // resolver / crear vehiculo (dominio = patente detectada en el Excel)
      const vehiculoDominio = row.vehiculoId || row.patente;
      if(!row.vehiculoId){
        const { data: existing } = await state.sb.from('vehiculos').select('dominio').eq('dominio', row.patente).maybeSingle();
        if(!existing){
          const { error: errCreate } = await state.sb.from('vehiculos')
            .insert({ dominio: row.patente, label: row.modelo, region: row.zona });
          if(errCreate) throw errCreate;
          if(row.zona) addZonaConocida(row.zona);
        }
      }
      vehiculosTocados.add(vehiculoDominio);
      if(row.zona) addZonaConocida(row.zona);

      const payload = {
        vehiculo_dominio: vehiculoDominio,
        periodo: row.periodo,
        periodo_label: row.periodoLabel,
        fecha_inicio: row.fecha_inicio,
        horas_motor: row.horas_motor,
        horas_ralenti: row.horas_ralenti,
        distancia_km: row.distancia_km,
        velocidad_maxima: row.velocidad_maxima,
        litros_ypf: row.litros_ypf,
        zona_periodo: row.zona,
        modelo_periodo: row.modelo,
        es_atipico: !!row.esAtipico,
        importacion_id: importacion.id,
      };

      if(row.estado==='nuevo'){
        const { error: errIns } = await state.sb.from('gps_reportes').insert(payload);
        if(errIns) throw errIns;
        nuevos++;
      }else if(row.estado==='actualizar'){
        const { error: errUpd } = await state.sb.from('gps_reportes').update(payload).eq('id', row.reporteId);
        if(errUpd) throw errUpd;
        actualizados++;
      }
    }

    // Reconciliar vehiculos.region/label con el período MÁS RECIENTE que tenga
    // ese dato, para cada vehículo tocado — así si un vehículo cambió de zona,
    // "vehiculos" siempre queda mostrando la zona vigente, sin pisarla con
    // cargas de meses viejos ni con datos vacíos.
    for(const dominio of vehiculosTocados){
      const { data: ultZona } = await state.sb.from('gps_reportes')
        .select('zona_periodo').eq('vehiculo_dominio', dominio).not('zona_periodo','is',null)
        .order('periodo', { ascending:false }).limit(1);
      const { data: ultModelo } = await state.sb.from('gps_reportes')
        .select('modelo_periodo').eq('vehiculo_dominio', dominio).not('modelo_periodo','is',null)
        .order('periodo', { ascending:false }).limit(1);
      const patch = {};
      if(ultZona && ultZona.length) patch.region = ultZona[0].zona_periodo;
      if(ultModelo && ultModelo.length) patch.label = ultModelo[0].modelo_periodo;
      if(Object.keys(patch).length) await state.sb.from('vehiculos').update(patch).eq('dominio', dominio);
    }

    await state.sb.from('gps_importaciones').update({
      registros_nuevos: nuevos, registros_actualizados: actualizados,
      registros_sin_cambios: sinCambios, registros_error: errores, estado:'completado',
    }).eq('id', importacion.id);

    toast(`Importación completada: ${nuevos} nuevos, ${actualizados} actualizados, ${sinCambios} sin cambios.`, 'success');
    state.importState = null;
    resultEl.innerHTML = '';
    document.getElementById('file-input').value = '';
    loadHistorialCargas();
  }catch(e){
    console.error(e);
    toast('Error al importar: ' + (e.message||e), 'error');
    btn.disabled = false; btn.textContent = 'Confirmar importación';
  }
}

/* ---------- Modal de confirmación genérico ---------- */
function confirmModal(title, body, confirmLabel){
  return new Promise(resolve=>{
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal">
      <h3>${esc(title)}</h3>
      <p>${esc(body)}</p>
      <div class="actions">
        <button class="btn btn-secondary" id="m-cancel">Cancelar</button>
        <button class="btn btn-primary" id="m-ok">${esc(confirmLabel||'Continuar')}</button>
      </div>
    </div>`;
    document.body.appendChild(bg);
    bg.querySelector('#m-cancel').onclick = () => { bg.remove(); resolve(false); };
    bg.querySelector('#m-ok').onclick = () => { bg.remove(); resolve(true); };
  });
}

/* ---------------------------------------------------------------------
   PWA — instalar en escritorio / agregar a pantalla de inicio
   --------------------------------------------------------------------- */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('btn-install');
  if(btn) btn.style.display = 'flex';
});
window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; });
function bindInstallButton(){
  const btn = document.getElementById('btn-install-icon');
  if(!btn) return;
  if(deferredInstallPrompt) btn.style.display = 'flex';
  btn.onclick = async () => {
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    btn.style.display = 'none';
  };
}
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* sin service worker no rompe la app, solo no queda instalable/offline */ });
  });
}

render();
